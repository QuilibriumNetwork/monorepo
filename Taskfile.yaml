    vars:
      DEPTH: '{{.DEPTH | default "8"}}'
      NATIVE_MIB: '{{.NATIVE_MIB | default "24576"}}'
    cmds:
      - docker build --platform linux/arm64 -f Dockerfile.source --target=test-lattice-transfer --build-arg PROOF_DEPTH={{.DEPTH}} --build-arg PROOF_NATIVE_MIB={{.NATIVE_MIB}} --progress=plain .

  test_lattice_transfer_verify_arm64_linux:
    desc: Verify existing transaction and admitted-root fixture bytes on Linux ARM64, including Darwin-produced proofs.
