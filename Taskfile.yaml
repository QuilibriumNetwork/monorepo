      - target/release/examples/transfer_roundtrip verify-binding {{.DEPTH}} '{{.TRANSACTION_PATH}}' {{.NATIVE_MIB}} '{{.EXPECTED_NETWORK_HEX}}' '{{.EXPECTED_APPLICATION_HEX}}'

  test_lattice_transfer_arm64_linux:
