# https://taskfile.dev

version: '3'

dotenv:
  - '.env'

env:
  DOCKER_BUILDKIT: '1'
  # Native macOS builds link against an in-tree FLINT source build
  # at `~/src/flint` (where `./configure --enable-static && make` has
  # been run and `libflint.a` lives at the root). The Rust
  # `classgroup` crate's build.rs walks both this in-tree layout and
  # the install-prefix layout used inside the Linux Docker stages
  # (`Dockerfile.source`'s `flint-builder`), so Linux tasks ignore
  # this env. Without it set, the macOS task falls back to
  # `brew --prefix flint`, which only ships dylibs — no `libflint.a`
  # — and build.rs panics with `FLINT at <prefix> contains neither
  # lib/libflint.a nor libflint.a`.
  FLINT_DIR:
    sh: echo "$HOME/src/flint"

vars:
  VERSION:
    sh: cat config/version.go | grep -A 1 "func GetVersion() \[\]byte {" | grep -Eo '0x[0-9a-fA-F]+' | xargs printf "%d.%d.%d"
  GIT_REPO:
    sh: git config --get remote.origin.url | sed 's/\.git$//'
  GIT_BRANCH:
    sh: git rev-parse --abbrev-ref HEAD
  GIT_COMMIT:
    sh: git log -1 --format=%h
  MAX_KEY_ID: 17
  # Persistent local BuildKit layer cache. The Linux Docker builds compile the
  # whole toolchain (protoc/go/GMP/FLINT) in the base stage — under amd64
  # EMULATION on an arm64 host FLINT alone is ~1h. Without an explicit cache the
  # `docker-container`/buildx exporter keeps nothing between runs, so it rebuilds
  # every time. A user-controlled local cache dir survives Docker's own build-
  # cache GC, so the toolchain layer is restored instead of recompiled. Requires
  # a `docker-container` builder (the default `docker` driver can't export a
  # local cache) — `_ensure_buildx` creates it once.
  BUILDX_BUILDER: quil-cache
  CACHE_ARGS: "--cache-from type=local,src=.docker-buildcache --cache-to type=local,dest=.docker-buildcache,mode=max"

tasks:
  _ensure_buildx:
    internal: true
    cmds:
      - docker buildx inspect {{.BUILDX_BUILDER}} >/dev/null 2>&1 || docker buildx create --name {{.BUILDX_BUILDER}} --driver docker-container --bootstrap
    silent: true

  status:
    desc: Display configuration info.
    cmds:
      - echo -n "Image name:" && echo " ${QUILIBRIUM_IMAGE_NAME:-quilibrium}"
      - echo -n "Version   :" && echo " {{.VERSION}}"
      - echo -n "Repo      :" && echo " {{.GIT_REPO}}"
      - echo -n "Branch    :" && echo " {{.GIT_BRANCH}}"
      - echo -n "Commit    :" && echo " {{.GIT_COMMIT}}"
      - echo -n "Max Key ID:" && echo " {{.MAX_KEY_ID}}"
    silent: true
    
  build_node_arm64_macos:
    desc: Build the Quilibrium node binary for MacOS ARM. Assumes it's ran from the same platform. Outputs to node/build.
    cmds:
      - vdf/generate.sh
      - bls48581/generate.sh
      - verenc/generate.sh
      - bulletproofs/generate.sh
      - ferret/generate.sh
      - channel/generate.sh
      - rpm/generate.sh
      - node/build.sh -o build/arm64_macos/node

  build_qclient_arm64_macos:
    desc: Build the qclient binary (Rust crates/quil-client) for MacOS ARM. Outputs to crates/quil-client/build.
    cmds:
      - vdf/generate.sh
      - bls48581/generate.sh
      - verenc/generate.sh
      - bulletproofs/generate.sh
      - ferret/generate.sh
      - channel/generate.sh
      - rpm/generate.sh
      - CRATE_NAME=quil-client BIN_NAME=qclient OUT_BIN_NAME=qclient OUT_BASE_DIR=crates/quil-client/build node/build.sh

  build_node_arm64_linux:
    desc: Build the Quilibrium node binary for ARM64 Linux. Outputs to node/build.
    cmds:
      - docker build --platform linux/arm64 -f Dockerfile.source --output node/build/arm64_linux --target=node .

  build_inspect_arm64_linux:
    desc: Build the quil-node inspection executable for ARM64 Linux, with scripts/mainnet_readonly_report.sh beside it (its --inspect-bin). Outputs to node/build/arm64_linux/inspect.
    cmds:
      - docker build --platform linux/arm64 -f Dockerfile.source --output node/build/arm64_linux/inspect --target=inspect .

  test_lattice_storage_arm64_macos:
    desc: Test confidential coin storage, snapshots and root publication without enabling proof admission.
    platforms: [darwin/arm64]
    cmds:
      - "cargo test -p quil-execution --features confidential-tokens --lib --locked token_intrinsic:: -- --test-threads=1"

  test_lattice_admission_arm64_macos:
    desc: Test token state staging, rollback and RocksDB reopen behavior; no complete native proof is generated.
    platforms: [darwin/arm64]
    cmds:
      - "cargo test -p quil-execution --features native-proof --lib --locked token_intrinsic:: -- --test-threads=1"
      - cargo test -p quil-execution --features native-proof --lib --locked hypergraph_state::tests -- --test-threads=1

  test_token_self_paid_fees_arm64_macos:
    desc: Check QUIL self-payment admission, engine regressions and current node build.
    platforms: [darwin/arm64]
    cmds:
      - cargo test -p quil-execution --features native-proof --lib --locked dispatch::tests -- --test-threads=1
      - cargo test -p quil-execution --features native-proof --lib --locked engines::tests -- --test-threads=1
      - cargo check -p quil-node --locked

  test_lattice_worker_process_arm64_macos:
    desc: Check verifier subprocess verdict, failure, input bounds and timeout handling without native proving.
    platforms: [darwin/arm64]
    cmds:
      - cargo test -p quil-lattice-ct --features confidential-tokens --lib --locked worker_ -- --test-threads=1

  build_lattice_worker_arm64_macos:
    desc: Build the experimental local amount-proof verification worker.
    platforms: [darwin/arm64]
    cmds:
      - cargo build -p quil-lattice-ct --features native-proof --bin quil-amount-proof-worker --release --locked

  test_lattice_worker_arm64_linux:
    desc: Test Linux ARM64 worker CPU limits, subprocess lifecycle and Rust client verification of a saved native amount proof.
    vars:
      WORKER_WALL_SECS: '{{.WORKER_WALL_SECS | default "3000"}}'
    cmds:
      - docker build --platform linux/arm64 -f Dockerfile.source --target=test-lattice-worker --build-arg PROOF_WORKER_WALL_SECS={{.WORKER_WALL_SECS}} --progress=plain .

  test_lattice_worker_admission_arm64_linux:
    desc: Check Linux worker lifecycle, limits and cross-process admission without native proof generation.
    cmds:
      - docker build --platform linux/arm64 -f Dockerfile.source --target=test-lattice-worker-admission --progress=plain .

  test_lattice_worker_admission_amd64_linux:
    desc: Check Linux amd64 worker lifecycle, limits and cross-process admission without native proof generation.
    cmds:
      - docker build --platform linux/amd64 -f Dockerfile.source --target=test-lattice-worker-admission --progress=plain .

  test_lattice_worker_amd64_linux:
    desc: Same worker/client checks on Linux x86_64 (SIMDe portable scalar backend, no AVX); first amd64 native lattice evidence.
    vars:
      WORKER_WALL_SECS: '{{.WORKER_WALL_SECS | default "3000"}}'
    cmds:
      - docker build --platform linux/amd64 -f Dockerfile.source --target=test-lattice-worker --build-arg PROOF_WORKER_WALL_SECS={{.WORKER_WALL_SECS}} --progress=plain .

  test_lattice_worker_native_arm64_macos:
    desc: Check a saved native mint proof in the local worker, including context rejection and unavailable submission budget.
    platforms: [darwin/arm64]
    deps: [build_lattice_worker_arm64_macos]
    cmds:
      - python3 crates/quil-lattice-ct/tools/check_amount_worker.py target/release/quil-amount-proof-worker review_artifacts/2026-09-09-amount-replacement/portable_simde/mint-full-macos-pass.bin 0101010101010101010101010101010101010101010101010101010101010101 11558584af7017a9bfd1ff1864302d643fbe58c62dcf90cbcd8fde74a26794d9

  test_lattice_worker_client_arm64_macos:
    desc: Verify a saved native mint through the Rust subprocess client, including context and local-budget errors.
    platforms: [darwin/arm64]
    deps: [build_lattice_worker_arm64_macos]
    env:
      QUIL_AMOUNT_WORKER_PATH: '{{.ROOT_DIR}}/target/release/quil-amount-proof-worker'
      QUIL_AMOUNT_WORKER_FIXTURE: '{{.ROOT_DIR}}/review_artifacts/2026-09-09-amount-replacement/portable_simde/mint-full-macos-pass.bin'
    cmds:
      - cargo test -p quil-lattice-ct --features confidential-tokens --lib --release --locked worker_client_verifies_saved_native_mint -- --ignored --nocapture --test-threads=1

  test_execution_context_arm64_macos:
    desc: Check consensus global-anchor propagation through execution routing and app/global materialization regressions.
    platforms: [darwin/arm64]
    cmds:
      - cargo test -p quil-execution --lib --locked process_message_preserves_distinct_global_context -- --test-threads=1
      - cargo test -p quil-engine --lib --locked app_shard_materialize -- --test-threads=1
      - cargo test -p quil-engine --lib --locked frame_materializer::tests -- --test-threads=1

  test_token_wire_arm64_macos:
    desc: Check bounded confidential token transport, consensus byte preservation and node compilation.
    platforms: [darwin/arm64]
    cmds:
      - cargo test -p quil-execution --lib --locked token_carrier -- --test-threads=1
      - cargo test -p quil-engine --lib --locked token_carrier -- --test-threads=1
      - cargo check -p quil-node --locked

  test_execution_failure_boundary_arm64_macos:
    desc: Check operation rollback and preservation of local execution failures through frame processing.
    platforms: [darwin/arm64]
    cmds:
      - cargo test -p quil-execution --features native-proof --lib --locked token_backend_failure_rolls_back -- --test-threads=1
      - cargo test -p quil-engine --lib --locked frame_materializer::tests -- --test-threads=1
      - cargo test -p quil-engine --lib --locked frame_processor::tests -- --test-threads=1
      - cargo test -p quil-engine --lib --locked app_shard_materialize -- --test-threads=1

  test_lattice_full_admission_arm64_macos:
    desc: Prove a complete transfer, verify and commit it, reopen RocksDB, recover recipients and reject replay.
    platforms: [darwin/arm64]
    vars:
      RESOURCE_TRACE: '{{.RESOURCE_TRACE | default "0"}}'
      NATIVE_MIB: '{{.NATIVE_MIB | default "24576"}}'
      TRANSACTION_PATH: '{{.TRANSACTION_PATH | default "/tmp/quil-execution-transfer.bin"}}'
    cmds:
      - QUIL_NATIVE_RESOURCE_TRACE='{{.RESOURCE_TRACE}}' QUIL_TEST_NATIVE_MIB='{{.NATIVE_MIB}}' QUIL_TEST_TRANSACTION_PATH='{{.TRANSACTION_PATH}}' cargo test -p quil-execution --features native-proof --lib --release --locked commit_verify::tests::complete_transfer_verifies_and_commits -- --ignored --nocapture --test-threads=1

  test_lattice_admission_arm64_linux:
    desc: Build the experimental execution adapter and run staging tests with the Linux ARM64 node toolchain.
    cmds:
      - docker build --platform linux/arm64 -f Dockerfile.source --target=test-lattice-admission --progress=plain .

  test_lattice_admission_amd64_linux:
    desc: Build the experimental execution adapter and run staging tests on Linux x86_64 (SIMDe portable scalar backend).
    cmds:
      - docker build --platform linux/amd64 -f Dockerfile.source --target=test-lattice-admission --progress=plain .

  test_lattice_full_admission_arm64_linux:
    desc: Prove, verify, stage and persist a complete transfer with the Linux ARM64 node toolchain.
    vars:
      RESOURCE_TRACE: '{{.RESOURCE_TRACE | default "0"}}'
      NATIVE_MIB: '{{.NATIVE_MIB | default "24576"}}'
    cmds:
      - docker build --platform linux/arm64 -f Dockerfile.source --target=test-lattice-full-admission --build-arg PROOF_NATIVE_MIB={{.NATIVE_MIB}} --build-arg PROOF_RESOURCE_TRACE={{.RESOURCE_TRACE}} --progress=plain .

  test_reward_witness_arm64_macos:
    desc: Verify QUIL reward RPC witnesses against committed roots and reject truncated or inconsistent balances.
    platforms: [darwin/arm64]
    cmds:
      - cargo test -p quil-execution --lib --locked reward_witness::tests -- --test-threads=1
      - cargo check -p quil-node --locked

  test_mint_authorization_witness_arm64_macos:
    desc: Check authorization RPC bounds, claim construction, wallet compilation and node integration.
    platforms: [darwin/arm64]
    cmds:
      - cargo test -p quil-rpc --lib --locked mint_authorization_witness_tests -- --test-threads=1
      - cargo test -p quil-execution --features confidential-tokens --lib --locked mint_authorization -- --test-threads=1
      - cargo test -p quil-client --features confidential-tokens --lib --locked wallet -- --test-threads=1
      - cargo check -p quil-node --locked

  test_lattice_wallet_arm64_macos:
    desc: Test wallet derivation and memo recovery through the native macOS toolchain.
    platforms: [darwin/arm64]
    cmds:
      - cargo test -p quil-client --features confidential-tokens --lib --locked wallet -- --test-threads=1

  test_lattice_wallet_owned_scan_arm64_macos:
    desc: Validate complete bounded wallet coin recovery and spent filtering over loopback RPC.
    platforms: [darwin/arm64]
    cmds:
      - cargo test -p quil-client --features confidential-tokens --lib --locked commands::token::wallet::submission_tests::wallet_scans_owned_unspent_coins_over_rpc -- --exact --ignored --nocapture --test-threads=1

  test_lattice_wallet_submission_arm64_macos:
    desc: Send mint and claim fixtures through authenticated loopback RPC; no live network or native admission.
    platforms: [darwin/arm64]
    cmds:
      - cargo test -p quil-client --features confidential-tokens --lib --locked wallet_submits_over_authenticated_rpc -- --ignored --nocapture --test-threads=1

  test_lattice_wallet_escrow_lookup_arm64_macos:
    desc: Fetch a full escrow over loopback RPC, verify its content address, and reject missing, altered and oversized records.
    platforms: [darwin/arm64]
    cmds:
      - cargo test -p quil-client --features confidential-tokens --lib --locked wallet_fetches_content_bound_escrow_over_rpc -- --ignored --nocapture --test-threads=1

  test_lattice_wallet_arm64_linux:
    desc: Test wallet derivation and memo recovery with the Linux ARM64 node toolchain.
    cmds:
      - docker build --platform linux/arm64 -f Dockerfile.source --target=test-lattice-wallet --progress=plain .

  test_settlement_arm64_macos:
    desc: Cross-domain settlement units, the paid consumer bundle, the relay window, and the native wallet settlement proof.
    platforms: [darwin/arm64]
    vars:
      NATIVE_MIB: '{{.NATIVE_MIB | default "24576"}}'
    cmds:
      - cargo test -p quil-execution --features native-proof --lib --release --locked -- settlement paid_hypergraph relayed_header custom_mint custom_token fee_credit uncovered_shard_tx entitlement proof_basis prefunded --test-threads=1
      - cargo test -p quil-engine --lib --release --locked settlement_relay -- --test-threads=1
      - QUIL_TEST_NATIVE_MIB='{{.NATIVE_MIB}}' cargo test -p quil-client --features native-proof --lib --release --locked wallet_rpc_proves_settlement -- --ignored --nocapture --test-threads=1

  test_settlement_arm64_linux:
    desc: Settlement units and the native wallet settlement proof on Linux ARM64 (completeness only).
    vars:
      NATIVE_MIB: '{{.NATIVE_MIB | default "24576"}}'
    cmds:
      - docker build --platform linux/arm64 -f Dockerfile.source --target=test-settlement-wallet --build-arg PROOF_NATIVE_MIB={{.NATIVE_MIB}} --progress=plain .

  test_settlement_amd64_linux:
    desc: Settlement units (no native proof) on Linux x86_64 (completeness only).
    cmds:
      - docker build --platform linux/amd64 -f Dockerfile.source --target=test-settlement --progress=plain .

  check_lattice_wallet_native_arm64_macos:
    desc: Compile the wallet RPC, transfer preparation, and native proving path.
    platforms: [darwin/arm64]
    cmds:
      - cargo check -p quil-client --features native-proof --lib --locked

  test_lattice_wallet_full_arm64_macos:
    desc: Exercise wallet RPC witnesses, native proving, public verification, and recipient recovery.
    platforms: [darwin/arm64]
    vars:
      NATIVE_MIB: '{{.NATIVE_MIB | default "24576"}}'
      TRANSACTION_PATH: '{{.TRANSACTION_PATH | default "/tmp/quil-wallet-rpc-transfer.bin"}}'
    cmds:
      - QUIL_TEST_NATIVE_MIB='{{.NATIVE_MIB}}' QUIL_TEST_TRANSACTION_PATH='{{.TRANSACTION_PATH}}' cargo test -p quil-client --features native-proof --lib --release --locked wallet_rpc_proves_transfer -- --ignored --nocapture --test-threads=1

  test_lattice_wallet_full_arm64_linux:
    desc: Exercise the full wallet RPC and proof path on Linux ARM64 without holding Cargo cache locks during proving.
    vars:
      NATIVE_MIB: '{{.NATIVE_MIB | default "24576"}}'
    cmds:
      - docker build --platform linux/arm64 -f Dockerfile.source --target=test-lattice-wallet-full --build-arg PROOF_NATIVE_MIB={{.NATIVE_MIB}} --progress=plain .

  test_lattice_witness_rpc_arm64_macos:
    desc: Test coin witness RPC request/response bounds and check the optional node provider.
    platforms: [darwin/arm64]
    cmds:
      - cargo test -p quil-hypergraph --lib --locked snapshot::tests -- --test-threads=1
      - cargo test -p quil-rpc --lib --locked witness_tests -- --test-threads=1
      - cargo check -p quil-node --features confidential-tokens --bin quil-node --locked

  test_lattice_coin_pages_arm64_macos:
    desc: Test bounded RocksDB coin-key paging across legacy and MVCC records.
    platforms: [darwin/arm64]
    cmds:
      - cargo test -p quil-store --lib --locked fixed_vertex_page -- --test-threads=1
      - cargo test -p quil-hypergraph --lib --locked fixed_vertex_page -- --test-threads=1

  test_lattice_detached_abi_arm64_macos:
    desc: Check Cargo artifact selection and execute native ABI tests outside the build cache.
    platforms: [darwin/arm64]
    vars:
      TEST_PATH: '{{.TEST_PATH | default "/tmp/quil-lattice-detached-abi-tests"}}'
    cmds:
      - python3 crates/quil-lattice-proof-sys/tools/build_test_binary.py quil-lattice-proof-sys native-backend '{{.TEST_PATH}}' --require-test tests::sampling_error_partial_proofs_can_be_freed
      - "{{.TEST_PATH}} --test-threads=1"

  test_lattice_proof_arm64_macos:
    desc: Test the experimental native proof ABI, Rust adapter and amount relation on macOS ARM64.
    platforms: [darwin/arm64]
    cmds:
      - python3 crates/quil-lattice-proof-sys/tools/check_build_guards.py
      - cargo test -p quil-lattice-proof-sys --features native-backend --release --locked
      - cargo test -p quil-lattice-ct --features native-proof --release --locked confidential -- --test-threads=1

  build_lattice_packed_shake_tests_arm64_macos:
    desc: Compile the test-only packed SHAKE native benchmark without executing proofs.
    platforms: [darwin/arm64]
    cmds:
      - cargo test -p quil-lattice-ct --features native-proof --lib --release --locked --no-run

  test_lattice_public_encoding_arm64_macos:
    desc: Check canonical public-coefficient encoding and isolated hashing cost.
    platforms: [darwin/arm64]
    cmds:
      - mkdir -p target/native-diagnostics
      - >-
        clang -O3 -std=gnu2x -march=armv8-a+crypto
        -Icrates/quil-lattice-proof-sys/adapter/shim
        -Icrates/quil-lattice-proof-sys/adapter
        -Icrates/quil-lattice-proof-sys/vendor/simde
        -Icrates/quil-lattice-proof-sys/vendor/labrados
        crates/quil-lattice-proof-sys/tools/public_encoding_check.c
        crates/quil-lattice-proof-sys/vendor/labrados/fips202.c
        -o target/native-diagnostics/public-encoding-check
      - target/native-diagnostics/public-encoding-check

  test_lattice_montgomery_arm64_macos:
    desc: Compare bounded ARM Montgomery kernels with integer references.
    platforms: [darwin/arm64]
    cmds:
      - mkdir -p target/native-diagnostics
      - >-
        clang -O3 -std=gnu2x -march=armv8-a+crypto
        -Icrates/quil-lattice-proof-sys/adapter/shim
        -Icrates/quil-lattice-proof-sys/adapter
        -Icrates/quil-lattice-proof-sys/vendor/simde
        -Icrates/quil-lattice-proof-sys/vendor/labrados
        crates/quil-lattice-proof-sys/tools/ntt_montgomery_check.c
        crates/quil-lattice-proof-sys/vendor/labrados/data.c
        -o target/native-diagnostics/ntt-montgomery-check
      - target/native-diagnostics/ntt-montgomery-check

  test_lattice_ntt_arm64_macos:
    desc: Check pinned transform outputs and measure forward/inverse NTT on public fixture vectors.
    platforms: [darwin/arm64]
    cmds:
      - cargo test -p quil-lattice-proof-sys --features native-backend --release --locked
      - cargo test -p quil-lattice-proof-sys --features native-backend --release --locked native_ntt_microbenchmark -- --ignored --nocapture --test-threads=1

  test_lattice_packed_shake_arm64_macos:
    desc: Measure a native proof of one test-only packed SHAKE circuit; not a full transaction.
    platforms: [darwin/arm64]
    env:
      QUIL_NATIVE_RESOURCE_TRACE: '1'
    cmds:
      - cargo test -p quil-lattice-ct --features native-proof --lib --release --locked confidential::relation::boolean::packed::packed_shake_native_roundtrip -- --exact --ignored --nocapture --test-threads=1

  audit_lattice_public_parameters:
    desc: Inventory native public parameters and exact challenge-support ceilings; not a security certificate.
    cmds:
      - python3 crates/quil-lattice-proof-sys/tools/audit_public_parameters.py

  test_lattice_proof_arm64_linux:
    desc: Test the experimental native proof ABI, Rust adapter and amount relation using the existing Linux ARM64 toolchain.
    cmds:
      - docker build --platform linux/arm64 -f Dockerfile.source --target=test-lattice-proof --progress=plain .

  test_lattice_issuance_arm64_macos:
    desc: Prove and independently verify the public-inflow amount relation; funding authorization remains external.
    platforms: [darwin/arm64]
    cmds:
      - cargo test -p quil-lattice-ct --features native-proof --release --locked native_issuance_amount_relation_roundtrip -- --ignored --nocapture --test-threads=1

  test_lattice_shield_full_arm64_macos:
    desc: Authorize a legacy source, prove confidential outputs, admit the shield, and check recovery/replay after reopening RocksDB.
    platforms: [darwin/arm64]
    vars:
      TRANSACTION_PATH: '{{.TRANSACTION_PATH | default "/tmp/quil-shield.bin"}}'
    cmds:
      - QUIL_TEST_TRANSACTION_PATH='{{.TRANSACTION_PATH}}' cargo test -p quil-execution --features native-proof --lib --release --locked complete_shield_authorizes_proves_and_reopens -- --ignored --nocapture --test-threads=1

  test_lattice_shield_dispatch_arm64_macos:
    desc: Prove and execute a QUIL shield through the token dispatcher and verify persistence/recovery/replay.
    platforms: [darwin/arm64]
    vars:
      TRANSACTION_PATH: '{{.TRANSACTION_PATH | default "/tmp/quil-dispatcher-shield.bin"}}'
    cmds:
      - QUIL_TEST_TRANSACTION_PATH='{{.TRANSACTION_PATH}}' cargo test -p quil-execution --features native-proof --lib --release --locked complete_shield_through_token_engine -- --ignored --nocapture --test-threads=1

  test_lattice_shield_dispatch_arm64_linux:
    desc: Execute a complete QUIL shield through the Linux ARM64 token dispatcher.
    vars:
      RESOURCE_TRACE: '{{.RESOURCE_TRACE | default "0"}}'
    cmds:
      - docker build --platform linux/arm64 -f Dockerfile.source --target=test-lattice-shield-dispatch --build-arg PROOF_RESOURCE_TRACE={{.RESOURCE_TRACE}} --progress=plain .

  test_lattice_transfer_dispatch_arm64_macos:
    desc: Prove and execute a two-input two-output confidential transfer through the token dispatcher, including same-bundle replay and RocksDB recovery.
    platforms: [darwin/arm64]
    vars:
      RESOURCE_TRACE: '{{.RESOURCE_TRACE | default "0"}}'
      NATIVE_MIB: '{{.NATIVE_MIB | default "24576"}}'
      TRANSACTION_PATH: '{{.TRANSACTION_PATH | default "/tmp/quil-dispatcher-transfer.bin"}}'
    cmds:
      - QUIL_NATIVE_RESOURCE_TRACE='{{.RESOURCE_TRACE}}' QUIL_TEST_NATIVE_MIB='{{.NATIVE_MIB}}' QUIL_TEST_TRANSACTION_PATH='{{.TRANSACTION_PATH}}' cargo test -p quil-execution --features native-proof --lib --release --locked complete_transfer_through_token_engine -- --ignored --nocapture --test-threads=1

  test_lattice_dispatch_preflight_arm64_macos:
    desc: Check token dispatcher configuration, suite, context, dimensions and fee-asset rejection.
    platforms: [darwin/arm64]
    cmds:
      - cargo test -p quil-execution --features native-proof --lib --release --locked dispatch::tests -- --test-threads=1

  test_lattice_mint_codec_arm64_macos:
    desc: Check token reward-mint framing, claim/output binding, conservation compiler and payload limits; no native proof is generated.
