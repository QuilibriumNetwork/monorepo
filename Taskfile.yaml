      EXPECTED_APPLICATION_HEX: '{{.EXPECTED_APPLICATION_HEX | default "0202020202020202020202020202020202020202020202020202020202020202"}}'
    preconditions:
      - test -f '{{.TRANSACTION_PATH}}'
      - test -f '{{.TRANSACTION_PATH}}.root'
    cmds:
      - cargo build -p quil-lattice-ct --features native-proof --example transfer_roundtrip --release --locked
      - /usr/bin/time -l target/release/examples/transfer_roundtrip verify {{.DEPTH}} '{{.TRANSACTION_PATH}}' {{.NATIVE_MIB}} '{{.EXPECTED_NETWORK_HEX}}' '{{.EXPECTED_APPLICATION_HEX}}'

  test_lattice_transfer_binding_arm64_macos:
    desc: Check an existing complete transaction, then require native rejection after memo and owner mutations.
    platforms: [darwin/arm64]
    requires:
      vars: [TRANSACTION_PATH, DEPTH]
    vars:
      NATIVE_MIB: '{{.NATIVE_MIB | default "24576"}}'
