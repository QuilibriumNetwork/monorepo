      NATIVE_MIB: '{{.NATIVE_MIB | default "24576"}}'
      TRANSACTION_PATH: '{{.TRANSACTION_PATH | default "/tmp/quil-transfer.bin"}}'
    cmds:
      - cargo build -p quil-lattice-ct --features native-proof --example transfer_roundtrip --release --locked
      - target/release/examples/transfer_roundtrip prove {{.DEPTH}} '{{.TRANSACTION_PATH}}' {{.NATIVE_MIB}}
      - target/release/examples/transfer_roundtrip verify {{.DEPTH}} '{{.TRANSACTION_PATH}}' {{.NATIVE_MIB}}

  test_lattice_transfer_verify_arm64_macos:
    desc: Verify an existing complete transfer and admitted-root fixture through the Darwin ARM64 native backend.
