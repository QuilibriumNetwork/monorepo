[package]
name = "quil-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "qagent — authenticated MCP server for a Quilibrium node. Reads are totals and node status. Sends are quoted on the host and submitted only with qagent confirm."

[[bin]]
name = "qagent"
path = "src/main.rs"

[dependencies]
quil-client = { path = "../quil-client" }
quil-config = { path = "../quil-config" }
quil-types = { path = "../quil-types" }
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "process", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tonic = "0.12"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
