[package]
name = "quil-crypto"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Crypto adapters wrapping existing Quilibrium crates with quil-types traits"

[features]
default = []
# Enable VDF frame prover (requires FLINT native library)
vdf-prover = ["dep:vdf"]

[dependencies]
quil-types = { path = "../quil-types" }
bls48581 = { path = "../bls48581" }
vdf = { path = "../vdf", optional = true }
ed448-rust = { path = "../ed448-rust" }
ed448-bulletproofs = { path = "../bulletproofs" }
sha3 = "0.10"
verenc = { path = "../verenc" }
channel = { path = "../channel" }
sha2 = "0.10"
rand = "0.8"
# Storage audits check independent openings in parallel.
rayon = "1"
# Falcon / FN-DSA-512 post-quantum consensus signatures (pure Rust, Pornin).
fn-dsa = "0.3"
# sntrup761 (Streamlined NTRU Prime) KEM — post-quantum config read/encryption
# keys, replacing X448. PQClean via pqcrypto-ntruprime (same crate the QUIC
# transport key-exchange uses).
pqcrypto-ntruprime = "0.1"
pqcrypto-traits = "0.3"
# AES-256-GCM for payloads sealed to an sntrup761 key (`seal`).
aes-gcm = "0.10"
poseidon-rs = "0.0.10"
ff_ce = "0.11"
num-bigint = "0.4"
hex = "0.4"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
k256 = { version = "0.13.4", features = ["ecdsa"] }
tracing = "0.1"
# Poseidon2 over KoalaBear: the hash of the hash storage proofs, which a STARK
# recomputes (`storage_hash`). Plonky3 needs Rust 1.93 or later.
p3-field = "=0.8.0"
p3-koala-bear = "=0.8.0"
p3-symmetric = "=0.8.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "bench_sig"
harness = false

[lints]
workspace = true
