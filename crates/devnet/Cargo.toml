[package]
name = "devnet"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Docker-based integration-test harness for the Quilibrium network"

[[bin]]
name = "devnet"
path = "src/main.rs"

[dependencies]
quil-p2p = { path = "../quil-p2p" }
quil-crypto = { path = "../quil-crypto" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
anyhow = "1"
thiserror = "2"
