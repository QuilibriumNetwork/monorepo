[package]
name = "devnet-proxy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "In-container gossip/gRPC partition proxy for the devnet harness"

[[bin]]
name = "devnet-proxy"
path = "src/main.rs"

[dependencies]
devnet = { path = ".." }
quil-p2p = { path = "../../quil-p2p" }
quil-types = { path = "../../quil-types" }
quil-engine = { path = "../../quil-engine" }
quil-crypto = { path = "../../quil-crypto" }
quil-config = { path = "../../quil-config" }
quil-lifecycle = { path = "../../quil-lifecycle" }
quil-rpc = { path = "../../quil-rpc" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.12", features = ["transport", "tls"] }
prost = "0.13"
tower = "0.4"
http = "1"
bytes = "1"
futures = "0.3"
hyper = { version = "1", features = ["server", "client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "2"
hex = "0.4"

[dev-dependencies]
# Test-only: encode view/epoch varints with the same codec the nodes use, so the
# hand-rolled reader in `simplex_view` is checked against the real encoder.
commonware-codec = "=2026.7.0"
