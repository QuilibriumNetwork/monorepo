[package]
name = "verenc"
version = "0.1.0"
authors = ["Anonymous conference submission", "Cassandra Heart"]
edition = "2018"
description = "Implementation of verifiable encryption of discrete logarithms with the DKG-in-the-head approach, adapted to Curve448"
license = "MIT"

[lib]
crate-type = ["lib", "staticlib"]
name = "verenc"

[dependencies]
sha2 = "0.9.0"
hex = "0.4.0"
rand = "0.8"
ed448-goldilocks-plus = "0.11.2"
uniffi = {  version= "0.28.3", features = ["cli"]}
serde = "1.0.208"
rand_chacha = "0.3.1"
zeroize = "1.7"

[build-dependencies]
uniffi = { version = "0.28.3", features = [ "build" ] }

# Clippy findings in code taken from the RDKGitH paper implementation: allowed
# here, not restyled. Unlisted lints keep their defaults.
[lints.clippy]
assign_op_pattern = "allow"
char_lit_as_u8 = "allow"
clone_on_copy = "allow"
empty_line_after_doc_comments = "allow"
explicit_counter_loop = "allow"
if_same_then_else = "allow"
let_and_return = "allow"
manual_div_ceil = "allow"
needless_range_loop = "allow"
needless_return = "allow"
op_ref = "allow"
print_with_newline = "allow"
ptr_arg = "allow"
redundant_field_names = "allow"
redundant_pattern_matching = "allow"
unnecessary_cast = "allow"
unnecessary_unwrap = "allow"
