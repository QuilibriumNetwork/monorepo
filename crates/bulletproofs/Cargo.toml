[package]
name = "ed448-bulletproofs"
# Before doing a release:
# - update version field 
# - update CHANGELOG
version = "1.0.0"
authors = ["Cassandra Heart <cassandra@quilibrium.com>"]
# original authors of bulletproofs = ["Cathie Yun <cathieyun@gmail.com>", 
#           "Henry de Valence <hdevalence@hdevalence.ca>",
#           "Oleg Andreev <oleganza@gmail.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/QuilibriumNetwork/ceremonyclient/crates/bulletproofs"
categories = ["cryptography"]
keywords = ["cryptography", "crypto", "ed448", "zero-knowledge", "bulletproofs"]
description = "A pure-Rust implementation of Bulletproofs using Ed448"
edition = "2018"

[dependencies]
ed448-goldilocks-plus = { version = "0.16.0" }
subtle = { version = "2", default-features = false }
sha3 = { version = "0.8", default-features = false }
digest = { version = "0.8", default-features = false }
rand = "0.8"
rand_core = "0.6"
byteorder = { version = "1", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc"] }
serde_derive = { version = "1", default-features = false }
thiserror = { version = "2" }
merlin = { version = "3", default-features = false }
clear_on_drop = { version = "0.2", default-features = false, optional = true }
lazy_static = "1.5"
uniffi = { version = "0.28.3", optional = true }
bincode = "1.3.3"

[build-dependencies]
uniffi = { version = "0.28.3", features = ["build"], optional = true }

[features]
default = ["uniffi-bindings", "clear_on_drop"]
uniffi-bindings = ["uniffi", "uniffi/build"]

[dev-dependencies]
hex = "0.4"
criterion = "0.3"
bincode = "1"
rand_chacha = "0.3"

[[test]]
name = "range_proof"

[[bench]]
name = "range_proof"
harness = false

[[bench]]
name = "generators"
harness = false

[[bench]]
name = "linear_proof"
harness = false

[lib]
crate-type = ["lib", "staticlib"]
name = "bulletproofs"

# Maintained fork of https://github.com/dalek-cryptography/bulletproofs.
# Scope cosmetic warnings here; retain soundness diagnostics.
[lints.rust]
dead_code = "allow"
deprecated = "allow"
unused_imports = "allow"

# Clippy findings in code taken from dalek-cryptography/bulletproofs: allowed
# here, not restyled. Unlisted lints keep their defaults.
[lints.clippy]
assign_op_pattern = "allow"
clone_on_copy = "allow"
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
empty_line_after_doc_comments = "allow"
explicit_counter_loop = "allow"
identity_op = "allow"
into_iter_on_ref = "allow"
legacy_numeric_constants = "allow"
len_zero = "allow"
manual_is_multiple_of = "allow"
manual_repeat_n = "allow"
needless_borrow = "allow"
needless_range_loop = "allow"
needless_return = "allow"
new_ret_no_self = "allow"
op_ref = "allow"
precedence = "allow"
redundant_closure = "allow"
redundant_field_names = "allow"
single_component_path_imports = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unit_arg = "allow"
unnecessary_cast = "allow"
unnecessary_lazy_evaluations = "allow"
unnecessary_unwrap = "allow"
useless_conversion = "allow"
useless_vec = "allow"
