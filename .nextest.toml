# cargo-nextest configuration (passed to CI via --config-file).
#
# The quil-engine e2e binaries run in-process multi-node consensus:
# each test spawns a 4–8-worker tokio runtime (one per archive) doing
# CPU-bound BLS signing, and the HotStuff pacemaker times ranks out in
# real time. On the 4-vCPU CI runner, nextest's default parallelism
# runs up to 4 such tests at once — the resulting oversubscription
# starves the pacemaker and consensus stalls past the tests' wait
# deadlines (flaky timeouts, e.g. `non_archive_join_lands_in_archive_frame`
# blowing its 90s budget). `threads-required = "num-test-threads"`
# reserves every scheduling slot, so each of these tests runs with the
# machine to itself; everything else still runs at full parallelism.

nextest-version = { required = "0.9.75" }

# A test that never returns fails its shard and is named instead of
# holding the shard until the job limit: nextest marks a test SLOW each
# period and kills it after terminate-after periods. Each limit is at
# least twice the longest time a green CI shard measured (Nov 2026:
# 192 s outside the shield-hold tests, 1,492 s for them).
#
# The limits do not cover a slow runner. One that built in 37 minutes
# against 6-9 on green shards ran three tests past these limits that
# would have passed. A TIMEOUT on such a runner names a slow runner,
# not a hang: compare the build step's time with a green shard's first.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.overrides]]
filter = 'package(quil-engine) and (binary(=e2e_consensus) or binary(=e2e_epoch_confirm))'
threads-required = "num-test-threads"

# The shield-hold tests fill the mempool past its count cap with tens
# of thousands of messages in a debug build: 840-1,492 s on green
# shards.
[[profile.default.overrides]]
filter = 'package(quil-engine) and test(/^app_engine::shield_hold_tests::/)'
slow-timeout = { period = "300s", terminate-after = 10 }
