syntax = "proto3";

package quilibrium.node.global.pb;

option go_package = "source.quilibrium.com/quilibrium/monorepo/node/protobufs";

import "application.proto";
import "channel.proto";
import "compute.proto";
import "hypergraph.proto";
import "keys.proto";
import "token.proto";
import "google/protobuf/empty.proto";

message LegacyProverRequest {
  repeated quilibrium.node.keys.pb.Ed448Signature public_key_signatures_ed448 = 1;
}

message SeniorityMerge {
  bytes signature = 1;
  uint32 key_type = 2;
  bytes prover_public_key = 3;
}

message ProverJoin {
  repeated bytes filters = 1;
  uint64 frame_number = 2;
  quilibrium.node.keys.pb.BLS48581SignatureWithProofOfPossession public_key_signature_bls48581 = 3;
  bytes delegate_address = 4;
  repeated SeniorityMerge merge_targets = 5;
  bytes proof = 6;
}

message ProverLeave {
  repeated bytes filters = 1;
  uint64 frame_number = 2;
  quilibrium.node.keys.pb.BLS48581AddressedSignature public_key_signature_bls48581 = 3;
}

message ProverPause {
  bytes filter = 1;
  uint64 frame_number = 2;
  quilibrium.node.keys.pb.BLS48581AddressedSignature public_key_signature_bls48581 = 3;
}

message ProverResume {
  bytes filter = 1;
  uint64 frame_number = 2;
  quilibrium.node.keys.pb.BLS48581AddressedSignature public_key_signature_bls48581 = 3;
}

// One leaf's storage root within a shard being confirmed.
message LeafRootEntry {
  // The leaf's sub-shard prefix path (6-bit nibbles) within the shard tree.
  repeated uint32 prefix = 1;
  // The registered KZG leaf root.
  bytes leaf_root = 2;
  // The leaf's block count.
  uint64 num_blocks = 3;
}

// All the leaf roots a prover registers for one shard at confirm time.
message ConfirmLeafRoots {
  bytes filter = 1;
  repeated LeafRootEntry entries = 2;
}

message ProverConfirm {
  bytes filter = 1 [deprecated = true];
  uint64 frame_number = 2;
  quilibrium.node.keys.pb.BLS48581AddressedSignature public_key_signature_bls48581 = 3;
  repeated bytes filters = 4;
  // Per-shard storage leaf roots registered as part of this confirm (folded in:
  // a confirm is the prover's per-epoch storage re-registration). Bound into the
  // confirm's signing message.
  repeated ConfirmLeafRoots leaf_roots = 5;
}

message ProverUpdate {
  bytes delegate_address = 1;
  quilibrium.node.keys.pb.BLS48581AddressedSignature public_key_signature_bls48581 = 2;
}

message ProverKick {
  uint64 frame_number = 1;
  bytes kicked_prover_public_key = 2;
  bytes conflicting_frame_1 = 3;
  bytes conflicting_frame_2 = 4;
  bytes commitment = 5;
  bytes proof = 6;
  quilibrium.node.application.pb.TraversalProof traversal_proof = 7;
}

message ProverReject {
  bytes filter = 1 [deprecated = true];
  uint64 frame_number = 2;
  quilibrium.node.keys.pb.BLS48581AddressedSignature public_key_signature_bls48581 = 3;
  repeated bytes filters = 4;
}

// ProverSeniorityMerge allows existing provers to claim seniority from their
// old peer keys. This is used as a repair mechanism for provers who joined
// before the seniority merge bug was fixed.
message ProverSeniorityMerge {
  // The frame number when this request is made
  uint64 frame_number = 1;
  // The BLS48-581 signature proving ownership of the prover key
  quilibrium.node.keys.pb.BLS48581AddressedSignature public_key_signature_bls48581 = 2;
  // The merge targets containing old peer keys to claim seniority from
  repeated SeniorityMerge merge_targets = 3;
}

// AltShardUpdate allows external entities to maintain their own state trees
// with provable ownership through signature verification. The shard address
// is derived from the poseidon hash of the BLS48-581 public key.
message AltShardUpdate {
  // The BLS48-581 public key that owns this shard (585 bytes)
  bytes public_key = 1;
  // The frame number when this update was signed (must be within 2 frames)
  uint64 frame_number = 2;
  // The root hash for vertex adds tree (64 or 74 bytes)
  bytes vertex_adds_root = 3;
  // The root hash for vertex removes tree (64 or 74 bytes)
  bytes vertex_removes_root = 4;
  // The root hash for hyperedge adds tree (64 or 74 bytes)
  bytes hyperedge_adds_root = 5;
  // The root hash for hyperedge removes tree (64 or 74 bytes)
  bytes hyperedge_removes_root = 6;
  // The BLS48-581 signature (74 bytes) over (FrameNumber || VertexAddsRoot ||
  // VertexRemovesRoot || HyperedgeAddsRoot || HyperedgeRemovesRoot)
  bytes signature = 7;
}

message ShardSplit {
  // The original shard address being split (32-63 bytes)
  bytes shard_address = 1;
  // The new sub-shard addresses proposed by the split
  repeated bytes proposed_shards = 2;
  // The frame number at which the split was detected
  uint64 frame_number = 3;
  // The BLS48-581 addressed signature proving prover identity
  quilibrium.node.keys.pb.BLS48581AddressedSignature public_key_signature_bls48581 = 4;
}

message ShardMerge {
  // The sub-shard addresses being merged
  repeated bytes shard_addresses = 1;
  // The parent shard address (first 32 bytes)
  bytes parent_address = 2;
  // The frame number at which the merge was detected
  uint64 frame_number = 3;
  // The BLS48-581 addressed signature proving prover identity
  quilibrium.node.keys.pb.BLS48581AddressedSignature public_key_signature_bls48581 = 4;
}

message MessageRequest {
  reserved 11, 12, 13;
  reserved "transaction", "pending_transaction", "mint_transaction";
  oneof request {
    quilibrium.node.global.pb.ProverJoin join = 1;
    quilibrium.node.global.pb.ProverLeave leave = 2;
    quilibrium.node.global.pb.ProverPause pause = 3;
    quilibrium.node.global.pb.ProverResume resume = 4;
    quilibrium.node.global.pb.ProverConfirm confirm = 5;
    quilibrium.node.global.pb.ProverReject reject = 6;
    quilibrium.node.global.pb.ProverKick kick = 7;
    quilibrium.node.global.pb.ProverUpdate update = 8;
    quilibrium.node.token.pb.TokenDeploy token_deploy = 9;
    quilibrium.node.token.pb.TokenUpdate token_update = 10;
    quilibrium.node.hypergraph.pb.HypergraphDeploy hypergraph_deploy = 14;
    quilibrium.node.hypergraph.pb.HypergraphUpdate hypergraph_update = 15;
    quilibrium.node.hypergraph.pb.VertexAdd vertex_add = 16;
    quilibrium.node.hypergraph.pb.VertexRemove vertex_remove = 17;
    quilibrium.node.hypergraph.pb.HyperedgeAdd hyperedge_add = 18;
    quilibrium.node.hypergraph.pb.HyperedgeRemove hyperedge_remove = 19;
    quilibrium.node.compute.pb.ComputeDeploy compute_deploy = 20;
    quilibrium.node.compute.pb.ComputeUpdate compute_update = 21;
    quilibrium.node.compute.pb.CodeDeployment code_deploy = 22;
    quilibrium.node.compute.pb.CodeExecute code_execute = 23;
    quilibrium.node.compute.pb.CodeFinalize code_finalize = 24;
    quilibrium.node.global.pb.FrameHeader shard = 25;
    quilibrium.node.global.pb.AltShardUpdate alt_shard_update = 26;
    quilibrium.node.global.pb.ProverSeniorityMerge seniority_merge = 27;
    quilibrium.node.global.pb.ShardSplit shard_split = 28;
    quilibrium.node.global.pb.ShardMerge shard_merge = 29;
    quilibrium.node.token.pb.TokenOperation token_operation = 30;
    // Canonical old-session closing certificate. The authorized request and
    // successor membership are read from committed global state.
    bytes committee_handoff = 31;
  }
  int64 timestamp = 99;
}

message MessageBundle {
  repeated MessageRequest requests = 1;
  int64 timestamp = 2;
}

message GlobalFrameHeader {
  // A strictly monotonically-increasing frame number. Used for culling old
  // frames past a configurable cutoff point.
  uint64 frame_number = 1;
  // A strictly monotonically-increasing rank number. Disambiguates timeouts
  // and allows for consistent determination of leader, without having to rely
  // on parsing internal state.
  uint64 rank = 2;
  // The self-reported timestamp from the proof publisher, encoded as an int64
  // of the Unix epoch in milliseconds. Should be good until
  // 292278994-08-17 07:12:55.807, at which point, this is someone else's
  // problem. Timestamps are imperfect, but smoothed in a rolling window to
  // ensure a network and quorum-stable difficulty adjustment. Anomalies are
  // bounded such that a timestamp beyond ten times the average issuance rate
  // is discarded in preference to the runner up electees, unless there is
  // simply no alternative available (for example, if a network outage occurred
  // from an upgrade or bug).
  int64 timestamp = 3;
  // The difficulty level used for the frame. Difficulty is calculated based on
  // the previous 60 timestamps correlated with difficulties, such that the
  // interval smooths out to align to the type-defined rate. This is expected to
  // increase subtly with clock speed and future hardware implementations, but
  // due to incentive alignment associated with global proofs, not fastest clock
  // in the west, should be gradual.
  uint32 difficulty = 4;
  // The output data from the VDF, serialized as bytes. For Wesolowski, this is
  // an encoding of the 258 byte Y value concatenated with the 258 byte proof
  // value.
  bytes output = 5;
  // The selector value of the previous frame's output, produced as a Poseidon
  // hash of the output.
  bytes parent_selector = 6;
  // The 256 global commitment values
  repeated bytes global_commitments = 7;
  // The prover tree root commitment
  bytes prover_tree_commitment = 8;
  // The request root commitment
  bytes requests_root = 9;
  // The prover of the frame
  bytes prover = 10;
  // The confirmation signatures of the frame
  quilibrium.node.keys.pb.BLS48581AggregateSignature public_key_signature_bls48581 = 11;
  // The prover shard's phase 1/2/3 subtree roots (vertex-removes,
  // hyperedge-adds, hyperedge-removes), in that order. `prover_tree_commitment`
  // (field 8) is the phase-0 (vertex-adds) root; together these commit ALL FOUR
  // prover-shard phases so catch-up sync can authenticate every phase, not just
  // vertex-adds. Bound into the VDF challenge alongside prover_tree_commitment.
  repeated bytes prover_tree_aux_roots = 12;
  // Total network world-state size in bytes as of the end of the previous
  // frame (the global prover shard excluded), certified by global consensus.
  // Every execution venue prices state growth from the value on the global
  // frame it is anchored to. Bound into the VDF challenge when non-zero.
  uint64 world_state_size = 13;
}

message FrameHeader {
  // The address dictates the depth of the shard, at a minimum, the app domain.
  bytes address = 1;
  // A strictly monotonically-increasing frame number. Used for culling old
  // frames past a configurable cutoff point.
  uint64 frame_number = 2;
  // A strictly monotonically-increasing rank number. Disambiguates timeouts
  // and allows for consistent determination of leader, without having to rely
  // on parsing internal state.
  uint64 rank = 3;
  // The self-reported timestamp from the proof publisher, encoded as an int64
  // of the Unix epoch in milliseconds. Should be good until
  // 292278994-08-17 07:12:55.807, at which point, this is someone else's
  // problem. Timestamps are imperfect, but smoothed in a rolling window to
  // ensure a network and quorum-stable difficulty adjustment. Anomalies are
  // bounded such that a timestamp beyond ten times the average issuance rate
  // is discarded in preference to the runner up electees, unless there is
  // simply no alternative available (for example, if a network outage occurred
  // from an upgrade or bug).
  int64 timestamp = 4;
  // The difficulty level used for the frame. Difficulty is calculated based on
  // the previous 60 timestamps correlated with difficulties, such that the
  // interval smooths out to align to the type-defined rate. This is expected to
  // increase subtly with clock speed and future hardware implementations, but
  // due to incentive alignment associated with global proofs, not fastest clock
  // in the west, should be gradual.
  uint32 difficulty = 5;
  // The output data from the VDF, serialized as bytes. For Wesolowski, this is
  // an encoding of the 258 byte Y value concatenated with the 258 byte proof
  // value.
  bytes output = 6;
  // The selector value of the previous frame's output, produced as a Poseidon
  // hash of the output.
  bytes parent_selector = 7;
  // The root commitment to the set of requests for the frame.
  bytes requests_root = 8;
  // The root commitments to to the hypergraph state at the address.
  repeated bytes state_roots = 9;
  // The prover of the frame, incorporated into the input to the VDF.
  bytes prover = 10;
  // The prover's proposed fee multiplier, incorporated into sliding window
  // averaging.
  uint64 fee_multiplier_vote = 11;
  // The confirmation signatures of the frame
  quilibrium.node.keys.pb.BLS48581AggregateSignature public_key_signature_bls48581 = 12;
  // The committee-signed storage-attestation root: a deterministic digest over
  // the canonical set of per-member proof-of-storage openings carried with this
  // frame (see StorageAttestation). Binds *which* openings the committee
  // attested into the signed header; a global validator recomputes this root
  // from the openings and re-verifies possession. Replaces the per-member VDF
  // multiproof as the proof each committee member is storing its shard data.
  bytes storage_attestation_root = 13;
  // The global frame this shard frame anchors its storage beacon to. The
  // verifier loads global_frame[global_frame_number].output (the global VDF
  // output) and derives rho_N from it — the unpredictable, lockstep-shared
  // value that selects every committee member's challenged leaf/block/point.
  // Committed into the VDF challenge so it cannot be altered post-hoc.
  uint64 global_frame_number = 14;
  // The committee's serialized StorageAttestation (the per-member PoRep
  // openings the global frame samples + audits). Carried as opaque bytes so it
  // survives the canonical→proto→canonical round-trip when a reward proof is
  // folded into a global frame's requests; decoded only at the global audit.
  // Empty pre-storage / for legacy-VDF frames.
  bytes storage_attestation = 15;
  // Sum of the proof-bound fees (QUIL base units, unsigned 16-byte big-endian)
  // of the operations materialized in the PREVIOUS frame of this shard
  // (frame_number - 1). Frame N's requests execute only after N is finalized,
  // so the total a committee can verify at proposal time is the previous
  // frame's. The global materializer credits it to the shard's provers.
  bytes fee_total = 16;
  // Cross-domain QUIL settlements executed by this shard in frames
  // frame_number-32 ..= frame_number-1: each entry is source frame (u64 BE) ‖
  // receipt ‖ parameter_context ‖ destination ‖ context ‖ settlement (u128 BE),
  // frames ascending, receipts ascending within a frame. Re-carried for 32
  // frames so a dropped header loses nothing; the global materializer writes
  // one GLOBAL settlement record per receipt, skipping receipts it recorded.
  // Only QUIL token shards carry entries.
  bytes settlements = 17;
  // This shard's part of the confidential coin accumulator as of frame
  // frame_number-1: the root of the subtree its prefix covers, per block-width
  // layer, with the coins under it (shard_accumulator::ShardReport). Carried
  // when those coins changed in that frame, and on every 32nd frame as a
  // heartbeat; empty otherwise and for a shard with no coins. The global
  // materializer folds every shard's report into the application's canonical
  // root (CROSS_SHARD_COMMIT.md §6).
  bytes accumulator = 18;
  // Confidential operations this shard verified in frames
  // frame_number-8 ..= frame_number-1, as compact spend entries
  // (global_commit::SpendEntry: consumptions, output addresses, escrow and
  // settlement bindings, fee — never the outputs themselves). Re-carried for 8
  // frames. The global materializer decides each once; nothing reaches shard
  // state until the owning shard delivers it (CROSS_SHARD_COMMIT.md §8).
  bytes spends = 19;
}

// One committee member's proof-of-storage opening for one challenge query in a
// frame: a KZG opening of a randomly-challenged block of a randomly-challenged
// leaf, plus the vector-commitment authentication path binding that block to
// the member's registered leaf root. The evaluation point and block/leaf
// indices are NOT carried — they are derived by the verifier from the frame's
// storage beacon (rho_n), so the prover has no freedom over what it opens.
message StorageOpening {
  // The shard this opening attests to (bound into the challenge + transcript).
  bytes shard_id = 1;
  // The replication epoch (the SDR re-encode generation).
  uint64 epoch = 2;
  // The attesting member's identity.
  bytes member_id = 3;
  // Query index for this member (which of its challenged leaves).
  uint32 query = 4;
  // The registered leaf commitment — the KZG root of the leaf's
  // vector-commitment tree.
  bytes leaf_root = 5;
  // Number of blocks in the leaf (sets the challenge block index + path depth).
  uint64 num_blocks = 6;
  // Authentication-path parent node commitments C_1..C_L (C_L == leaf_root),
  // bottom-to-top. Empty for a single-block leaf.
  repeated bytes path_commits = 7;
  // KZG opening proofs for the authentication path, aligned to path_commits.
  repeated bytes path_proofs = 8;
  // The challenged block's KZG commitment (the bottom of the path).
  bytes commitment = 9;
  // The claimed evaluation at the derived point (scalar bytes).
  bytes value = 10;
  // The KZG opening proof for the possession opening.
  bytes proof = 11;
}

// The set of per-member storage openings carried with an app-shard frame. The
// frame header's storage_attestation_root commits to this set.
message StorageAttestation {
  repeated StorageOpening openings = 1;
}

message ProverLivenessCheck {
  // The filter for the prover's commitment in the trie
  bytes filter = 1;
  // The rank of the consensus clique
  uint64 rank = 2;
  // The frame number for which this liveness check is being sent
  uint64 frame_number = 3;
  // The timestamp when the liveness check was created
  int64 timestamp = 4;
  // The hash of the shard commitments and prover root
  bytes commitment_hash = 5;
  // The BLS signature with the prover's address
  quilibrium.node.keys.pb.BLS48581AddressedSignature public_key_signature_bls48581 = 6;
}

message AppShardProposal {
  // The associated state for the proposal
  AppShardFrame state = 1;
  // The parent quorum certificate to this state
  QuorumCertificate parent_quorum_certificate = 2;
  // The previous rank's timeout certificate, if applicable
  TimeoutCertificate prior_rank_timeout_certificate = 3;
  // The proposer's vote
  ProposalVote vote = 4;
}

message GlobalProposal {
  // The associated state for the proposal
  GlobalFrame state = 1;
  // The parent quorum certificate to this state
  QuorumCertificate parent_quorum_certificate = 2;
  // The previous rank's timeout certificate, if applicable
  TimeoutCertificate prior_rank_timeout_certificate = 3;
  // The proposer's vote
  ProposalVote vote = 4;
}

message ProposalVote {
  // The filter for the prover's commitment in the trie
  bytes filter = 1;
  // The rank of the consensus clique
  uint64 rank = 2;
  // The frame number for which this proposal applies
  uint64 frame_number = 3;
  // The selector being voted for
  bytes selector = 4;
  // The timestamp when the vote was created
  uint64 timestamp = 5;
  // The BLS signature with the voter's address
  quilibrium.node.keys.pb.BLS48581AddressedSignature public_key_signature_bls48581 = 6;
}

message TimeoutState {
  // The latest quorum certificate seen by the pacemaker.
  QuorumCertificate latest_quorum_certificate = 1;
  // The previous rank's timeout certificate, if applicable.
  TimeoutCertificate prior_rank_timeout_certificate = 2;
  // The signed payload which will become part of the new timeout certificate.
  ProposalVote vote = 3;
  // TimeoutTick is the number of times the `timeout.Controller` has
	// (re-)emitted the timeout for this rank. When the timer for the rank's
	// original duration expires, a `TimeoutState` with `TimeoutTick = 0` is
	// broadcast. Subsequently, `timeout.Controller` re-broadcasts the
	// `TimeoutState` periodically  based on some internal heuristic. Each time
	// we attempt a re-broadcast, the `TimeoutTick` is incremented. Incrementing
	// the field prevents de-duplicated within the network layer, which in turn
	// guarantees quick delivery of the `TimeoutState` after GST and facilitates
	// recovery.
  uint64 timeout_tick = 4;
  // The timestamp of the message (not the timeout state)
  uint64 timestamp = 5;
}

message QuorumCertificate {
  // The filter for the prover's commitment in the trie
  bytes filter = 1;
  // The rank of the consensus clique
  uint64 rank = 2;
  // The frame number for which this certificate applies
  uint64 frame_number = 3;
  // The selector (hash) of the confirmed frame
  bytes selector = 4;
  // The timestamp of the message (not the certificate)
  uint64 timestamp = 5;
  // The aggregated BLS signature from all voters
  quilibrium.node.keys.pb.BLS48581AggregateSignature aggregate_signature = 6;
}

message TimeoutCertificate {
  // The filter for the prover's commitment in the trie
  bytes filter = 1;
  // The rank of the consensus clique
  uint64 rank = 2;
  // The latest ranks in signer order
  repeated uint64 latest_ranks = 3;
  // The latest quorum certificate from all timeouts
  QuorumCertificate latest_quorum_certificate = 4;
  // The timestamp of the message (not the certificate)
  uint64 timestamp = 5;
  // The aggregated BLS signature from all voters
  quilibrium.node.keys.pb.BLS48581AggregateSignature aggregate_signature = 6;
}

message GlobalFrame {
  GlobalFrameHeader header = 1;
  repeated MessageBundle requests = 2;
}

message AppShardFrame {
  FrameHeader header = 1;
  repeated MessageBundle requests = 2;
  // The per-member proof-of-storage openings the committee attested this frame.
  // The header's storage_attestation_root commits to this set; a full-frame
  // holder (gossip validator / committee member) recomputes the root and
  // re-verifies possession against each member's registered leaf roots.
  StorageAttestation storage_attestation = 3;
}

message GlobalAlert {
  string message = 1;
  bytes signature = 2;
}

message GetGlobalFrameRequest {
  uint64 frame_number = 1;
}

message GlobalFrameResponse {
  GlobalFrame frame = 1;
  bytes proof = 2;
}

message GetGlobalProposalRequest {
  uint64 frame_number = 1;
}

message GlobalProposalResponse {
  GlobalProposal proposal = 1;
}

message GetAppShardFrameRequest {
  bytes filter = 1;
  uint64 frame_number = 2;
}

message AppShardFrameResponse {
  AppShardFrame frame = 1;
  bytes proof = 2;
}

message GetAppShardProposalRequest {
  bytes filter = 1;
  uint64 frame_number = 2;
}

message AppShardProposalResponse {
  AppShardProposal proposal = 1;
}


message GetAppShardsRequest {
  bytes shard_key = 1;
  repeated uint32 prefix = 2;
}

message AppShardInfo {
  repeated uint32 prefix = 1;
  bytes size = 2;
  uint64 data_shards = 3;
  repeated bytes commitment = 4;
  bytes shard_key = 5;
  // Archive's durable materialization cursor; advanced only after state commit.
  uint64 materialized_frame = 6;
  // Latest app frame retained by the same archive, for a truthful backlog.
  uint64 latest_frame = 7;
  // A recorded split or merge that has not applied yet names this shard; the
  // chain refuses a join that includes it until the change applies.
  bool pending_change = 8;
}

message GetAppShardsResponse {
  repeated AppShardInfo info = 1;
}

message GetGlobalShardsRequest {
  bytes l1 = 1;
  bytes l2 = 2;
}

message GetGlobalShardsResponse {
  bytes size = 1;
  repeated bytes commitment = 2;
}

message GetLockedAddressesRequest {
  // The shard address identifier, in split L2||nibbles form
  bytes shard_address = 1;
  // The frame number of the locked address request, to disambiguate early/late
  // requests
  uint64 frame_number = 2;
}

message LockedTransaction {
  // The hash of the locked transaction
  bytes transaction_hash = 1;
  // The shard address identifier the lock covers, in split L2||nibbles form
  repeated bytes shard_addresses = 2;
  // Whether all shard addresses impacted have committed to this value
  bool committed = 3;
  // Whether the proposed frames had a winning weight witness
  bool filled = 4;
}

message GetLockedAddressesResponse {
  repeated LockedTransaction transactions = 1;
}

message GlobalGetWorkerInfoRequest {}

message GlobalGetWorkerInfoResponseItem {
  uint32 core_id = 1;
  string listen_multiaddr = 2;
  string stream_listen_multiaddr = 3;
  bytes filter = 4;
  uint64 total_storage = 5;
  bool allocated = 6;
}

message GlobalGetWorkerInfoResponse {
  repeated GlobalGetWorkerInfoResponseItem workers = 1;
}

message StreamGlobalMessagesRequest {}

message StreamGlobalMessagesResponse {
  bytes data = 1;
  bytes bitmask = 2;
}

message SubmitGlobalMessageRequest {
  bytes data = 1;
}

message SubmitGlobalMessageResponse {}

// Direct point-to-point delivery of a global-consensus message
// (proposal / vote / timeout) between genesis archives. Global
// consensus is moved off BlossomSub gossip because a full-coverage
// proposal exceeds the gossip message-size ceiling; the ~6-member
// genesis committee is direct-peered, so proposals/votes/timeouts are
// sent point-to-point over this mTLS RPC instead. `bitmask` carries the
// original topic (GLOBAL_FRAME or GLOBAL_CONSENSUS) so the receiver
// routes it through the same handler the gossip arm used. App-shard
// consensus is unaffected (it stays on per-shard gossip topics).
message SubmitGlobalConsensusRequest {
  bytes bitmask = 1;
  bytes data = 2;
}

message SubmitGlobalConsensusResponse {}

message SendShardConsensusDirectRequest {
  bytes filter = 1;
  uint64 channel = 2;
  // The simplex message, unframed.
  bytes data = 3;
  // The committee keys it is addressed to.
  repeated bytes recipients = 4;
}

message SendShardConsensusDirectResponse {
  // Every recipient accepted it; otherwise the worker sends it to the topic.
  bool delivered = 1;
}

message SubmitWorkerProverMessageRequest {
  // The standalone worker's core, for the node's log.
  uint32 core_id = 1;
  // One canonical GLOBAL request: a certified app-shard FrameHeader (a reward
  // proof) or a committee-handoff submission. The node wraps it in a bundle.
  bytes request = 2;
}

message GetHistoricalCommitteesRequest {
  // The legacy app shard's filter.
  bytes filter = 1;
  // The GLOBAL frame its certificate's committee is read at.
  uint64 anchor = 2;
}

message HistoricalCommittee {
  repeated bytes members = 1;
}

message GetHistoricalCommitteesResponse {
  // The distinct committees the GLOBAL prover tree gave around the anchor.
  repeated HistoricalCommittee committees = 1;
}

message SubmitWorkerProverMessageResponse {
  // The node queued it for submission; false while a coverage halt holds
  // reward proofs back.
  bool accepted = 1;
}

// Forest-sync RPCs (JMT commitment diff + readable vertex blobs). Restored to
// match global_service.rs / archive_client.rs.
message GetForestNodeRequest {
  bytes shard_id = 1;
  uint32 phase = 2;
  bytes node_key = 3;
}
message GetForestNodeResponse {
  bool found = 1;
  bytes node = 2;
}
message GetForestValueRequest {
  bytes shard_id = 1;
  uint32 phase = 2;
  uint64 version = 3;
  bytes key_hash = 4;
}
message GetForestValueResponse {
  bool found = 1;
  bytes value = 2;
}

// Batched forest reads: one request carries many keys and the archive reads
// them under one storage slot. A response answers a PREFIX of the requested
// keys in order (it stops early at the archive's size budget); the client asks
// again for the rest.
message ForestReadResult {
  bool found = 1;
  bytes data = 2;
}
message GetForestNodesRequest {
  bytes shard_id = 1;
  uint32 phase = 2;
  // borsh(NodeKey) each.
  repeated bytes node_keys = 3;
}
message GetForestNodesResponse {
  repeated ForestReadResult nodes = 1;
}
message ForestValueKey {
  uint64 version = 1;
  bytes key_hash = 2;
}
message GetForestValuesRequest {
  bytes shard_id = 1;
  uint32 phase = 2;
  repeated ForestValueKey keys = 3;
}
message GetForestValuesResponse {
  repeated ForestReadResult values = 1;
}
// Every leaf of a shard/phase tree with a key in [first, last] after `after`,
// each at its newest value at or below `version`, in key order: a bootstrap
// lists its whole subtree in a few sequential reads instead of walking it.
// An owner's legacy (transparent) coins, ascending by address. Owner,
// amount and origin are public; served from an archive's owner index.
message ListLegacyCoinsRequest {
  bytes domain = 1;
  bytes owner = 2;   // 32 bytes
  bytes after = 3;   // coin address cursor; empty starts
}
message LegacyCoin {
  bytes address = 1;
  bytes amount = 2;  // 16 bytes, little-endian
  bytes origin = 3;
  bool shielded = 4; // GLOBAL recorded it consumed by a shield
}
message ListLegacyCoinsResponse {
  repeated LegacyCoin coins = 1;
  bytes cursor = 2;
  bool has_more = 3;
}
message GetForestLeavesRequest {
  bytes shard_id = 1;
  uint32 phase = 2;
  uint64 version = 3;
  // 32 bytes each.
  bytes first = 4;
  bytes last = 5;
  // Continue after this key (32 bytes); empty starts at `first`.
  bytes after = 6;
}
message ForestLeaf {
  bytes key_hash = 1;
  bytes value = 2;
}
message GetForestLeavesResponse {
  repeated ForestLeaf leaves = 1;
  // More leaves may follow the last one listed.
  bool more = 2;
}
message VertexBlobKey {
  bytes id = 1;
  // Read as of this tree version (latest version at or below it).
  uint64 version = 2;
}
message GetVertexBlobsRequest {
  bytes shard_key = 1;
  uint32 phase = 2;
  repeated VertexBlobKey blobs = 3;
}
message GetVertexBlobsResponse {
  repeated ForestReadResult blobs = 1;
}
message GetForestHeadRequest {
  bytes shard_id = 1;
  uint32 phase = 2;
}
message GetForestHeadResponse {
  bool found = 1;
  uint64 version = 2;
  bytes root = 3;
}
message GetForestPreimageRequest {
  bytes shard_id = 1;
  uint32 phase = 2;
  bytes key_hash = 3;
}
message GetForestPreimageResponse {
  bool found = 1;
  bytes raw_key = 2;
}
message GetVertexBlobRequest {
  bytes shard_key = 1;  // app ShardKey (l1[3] ‖ l2[32])
  uint32 phase = 2;
  bytes id = 3;         // 64-byte vertex id (app ‖ data)
  // MVCC pin: read the vertex "as-of" this tree version (latest write <= version),
  // matching the forest leaf that the diff addressed. Without exact_version,
  // 0 means latest for older callers. Exact pins can address tree version 0.
  uint64 version = 4;
  bool exact_version = 5;
}
message GetVertexBlobResponse {
  bool found = 1;
  bytes blob = 2;
}
// A single historical GLOBAL vertex, authenticated at the requested root.
// Bounded to 32 KiB; never installs or rewinds the recipient's GLOBAL tree.
message GetGlobalVertexProofRequest {
  bytes root = 1;
  bytes address = 2;
  bool allow_forward = 3; // a worker may ask its master to try an archive once
}
message GetGlobalVertexProofResponse {
  bool found = 1;
  bytes proof = 2;
}
// Worker-only discovery from its authenticated master's verified archive pool.
// At most 32 host:port entries, each at most 512 bytes.
message GetArchiveEndpointsRequest {}
message GetArchiveEndpointsResponse {
  repeated string endpoints = 1;
}
message ResolveRootRequest {
  bytes shard_id = 1;  // addr_path_shard_id(app, prefix) or single-shard id
  uint32 phase = 2;
  bytes root = 3;      // 32-byte authenticated tree root
}
message ResolveRootResponse {
  bool found = 1;
  uint64 version = 2;       // peer's local version whose tree root == `root`
  uint64 global_frame = 3;  // global frame at which that version committed
}
message GetAppManifestRequest {
  bytes app_address = 1;  // 32-byte app address
  uint32 phase = 2;
  bytes app_root = 3;     // 32-byte authenticated aggregate app root
}
message AppManifestEntry {
  bytes prefix = 1;   // sub-shard bit-path prefix (u32 BE words concatenated)
  bytes root = 2;     // 32-byte sub-shard tree root
  uint64 version = 3; // sub-shard local version
}
message GetAppManifestResponse {
  bool found = 1;
  repeated AppManifestEntry entries = 2;
}

service GlobalService {
  rpc GetGlobalFrame (GetGlobalFrameRequest) returns (GlobalFrameResponse);
  rpc GetGlobalProposal (GetGlobalProposalRequest) returns (GlobalProposalResponse);
  rpc GetAppShards(GetAppShardsRequest) returns (GetAppShardsResponse);
  rpc GetGlobalShards(GetGlobalShardsRequest) returns (GetGlobalShardsResponse);
  rpc GetLockedAddresses(GetLockedAddressesRequest) returns (GetLockedAddressesResponse);
  rpc GetWorkerInfo(GlobalGetWorkerInfoRequest) returns (GlobalGetWorkerInfoResponse);
  rpc StreamGlobalMessages(StreamGlobalMessagesRequest) returns (stream StreamGlobalMessagesResponse);
  rpc SubmitGlobalMessage(SubmitGlobalMessageRequest) returns (SubmitGlobalMessageResponse);
  rpc SubmitGlobalConsensus(SubmitGlobalConsensusRequest) returns (SubmitGlobalConsensusResponse);
  rpc GetForestNode(GetForestNodeRequest) returns (GetForestNodeResponse);
  rpc GetForestValue(GetForestValueRequest) returns (GetForestValueResponse);
  rpc GetForestHead(GetForestHeadRequest) returns (GetForestHeadResponse);
  rpc GetForestPreimage(GetForestPreimageRequest) returns (GetForestPreimageResponse);
  rpc GetVertexBlob(GetVertexBlobRequest) returns (GetVertexBlobResponse);
  // Batched forms of GetForestNode / GetForestValue / GetVertexBlob.
  rpc GetForestNodes(GetForestNodesRequest) returns (GetForestNodesResponse);
  rpc GetForestValues(GetForestValuesRequest) returns (GetForestValuesResponse);
  rpc GetVertexBlobs(GetVertexBlobsRequest) returns (GetVertexBlobsResponse);
  rpc GetForestLeaves(GetForestLeavesRequest) returns (GetForestLeavesResponse);
  rpc GetGlobalVertexProof(GetGlobalVertexProofRequest) returns (GetGlobalVertexProofResponse);
  rpc GetArchiveEndpoints(GetArchiveEndpointsRequest) returns (GetArchiveEndpointsResponse);
  rpc ResolveRoot(ResolveRootRequest) returns (ResolveRootResponse);
  rpc GetAppManifest(GetAppManifestRequest) returns (GetAppManifestResponse);
  // A standalone worker's shard resolver message, delivered directly by its
  // own master to the committee members it names over the master's peer
  // connections. Only the node's own identity may call it.
  rpc SendShardConsensusDirect(SendShardConsensusDirectRequest) returns (SendShardConsensusDirectResponse);
  // A standalone worker's GLOBAL submission (finalized shard frame headers,
  // committee-handoff seals), sent on by its own master through the master's
  // archive transport exactly as it sends its thread workers'. Only the node's
  // own identity may call it.
  rpc SubmitWorkerProverMessage(SubmitWorkerProverMessageRequest) returns (SubmitWorkerProverMessageResponse);
  // The committees that could have certified a legacy app frame anchored at
  // a GLOBAL frame, rebuilt by the node from authenticated GLOBAL state, for
  // its own standalone workers. Only the node's own identity may call it.
  rpc GetHistoricalCommittees(GetHistoricalCommitteesRequest) returns (GetHistoricalCommitteesResponse);
}

service AppShardService {
  rpc GetAppShardFrame (GetAppShardFrameRequest) returns (AppShardFrameResponse);
  rpc GetAppShardProposal (GetAppShardProposalRequest) returns (AppShardProposalResponse);
  // Peer-to-peer coin scan: a node that does not cover an application asks one
  // that does, so a wallet reads its own node rather than hunting for a node
  // with the right coverage. Same page contract as the wallet-facing scan —
  // snapshot-pinned, address-ordered, cursor-continued. A node that does not
  // serve the application refuses rather than returning an empty page.
  rpc ListShardCoins (ListShardCoinsRequest) returns (ListShardCoinsResponse);
  // Peer-to-peer legacy coin listing, answered only from the serving node's
  // own owner index (never forwarded again).
  rpc ListShardLegacyCoins (ListLegacyCoinsRequest) returns (ListLegacyCoinsResponse);
  // Peer-to-peer coin witnesses: the membership paths a wallet needs to SPEND
  // a coin. A forwarded scan shows a balance; without this the holder still
  // cannot move it from a node that does not cover the application.
  rpc GetShardCoinWitnesses (GetShardCoinWitnessesRequest) returns (GetShardCoinWitnessesResponse);
  // Wallet escrow discovery uses the same coverage and snapshot contract.
  rpc ListShardEscrows (ListShardCoinsRequest) returns (ListShardEscrowsResponse);
  // Current application vertex data from worker stores, with an explicit
  // coverage check. Forest-sync absence on a master store is not a wallet read.
  rpc GetShardVertex (GetShardVertexRequest) returns (GetShardVertexResponse);
  // A shard's recorded per-frame outgoing records (fee total, settlements,
  // spends, accumulator digest and report) for `[from_frame, through_frame]`.
  // Unauthenticated data: a successor member accepts it only if the chain it
  // recomputes equals its predecessor's quorum-certified history root.
  rpc GetShardOutgoingHistory (GetShardOutgoingHistoryRequest) returns (GetShardOutgoingHistoryResponse);
}

message GetShardOutgoingHistoryRequest {
  bytes filter = 1;
  uint64 from_frame = 2;
  uint64 through_frame = 3;
}

message ShardFrameOutgoing {
  uint64 frame_number = 1;
  bytes fee_total = 2;
  bytes settlements = 3;
  bytes spends = 4;
  bytes accumulator_digest = 5;
  bytes accumulator_report = 6;
}

// Frames in ascending order from `from_frame`, contiguous, possibly fewer than
// requested (a bounded page); the caller continues from the next frame.
message GetShardOutgoingHistoryResponse {
  repeated ShardFrameOutgoing frames = 1;
}

message ShardEscrow {
  bytes address = 1;
  bytes raw_data = 2;
}

message ListShardEscrowsResponse {
  bytes network = 1;
  bytes snapshot_id = 2;
  repeated ShardEscrow escrows = 3;
  bytes cursor = 4;
  bool has_more = 5;
}

message GetShardVertexRequest {
  bytes address = 1;
}

message GetShardVertexResponse {
  bool found = 1;
  bytes blob = 2;
}

message GetShardCoinWitnessesRequest {
  bytes domain = 1;
  repeated bytes addresses = 2;
}

// Mirrors node.pb CoinWitness (node.proto imports global.proto, so the
// peer-facing copy lives here rather than creating a cycle).
message ShardCoinWitness {
  bytes address = 1;
  bool found = 2;
  repeated bytes siblings = 3;
  repeated bool right = 4;
}

message GetShardCoinWitnessesResponse {
  bytes network = 1;
  bytes root_record = 2;
  uint32 depth = 3;
  repeated ShardCoinWitness witnesses = 4;
}

message ListShardCoinsRequest {
  bytes domain = 1;
  bytes snapshot_id = 2;
  bytes after = 3;
}

// Mirrors node.pb ConfidentialCoin; node.proto imports global.proto, so the
// peer-facing scan carries its own copy rather than creating a cycle.
message ShardCoin {
  bytes address = 1;
  uint64 frame_number = 2;
  bytes owner = 3;
  bytes commitment = 4;
  bytes memo = 5;
  uint64 position = 6;
}

message ListShardCoinsResponse {
  bytes network = 1;
  bytes snapshot_id = 2;
  bytes root_record = 3;
  repeated ShardCoin coins = 4;
  bytes cursor = 5;
  bool has_more = 6;
}

message SendMessage {
  bytes peer_id = 1;
  uint32 circ_id = 2;
  bytes cell = 3;
}

message ReceiveMessage {
  bytes source_peer_id = 1;
  uint32 circ_id = 2;
  bytes cell = 3;
}

service OnionService {
  rpc Connect(stream SendMessage) returns (stream ReceiveMessage);
}

message GetKeyRegistryRequest {
  bytes identity_key_address = 1;
}

message GetKeyRegistryResponse {
  quilibrium.node.keys.pb.KeyRegistry registry = 1;
  string error = 2;
}

message GetKeyRegistryByProverRequest {
  bytes prover_key_address = 1;
}

message GetKeyRegistryByProverResponse {
  quilibrium.node.keys.pb.KeyRegistry registry = 1;
  string error = 2;
}

message PutIdentityKeyRequest {
  bytes address = 1;
	quilibrium.node.keys.pb.Ed448PublicKey identity_key = 2;
}

message PutIdentityKeyResponse {
  string error = 1;
}

message PutProvingKeyRequest {
  quilibrium.node.keys.pb.BLS48581SignatureWithProofOfPossession proving_key = 1;
}

message PutProvingKeyResponse {
  string error = 1;
}

message PutCrossSignatureRequest {
  bytes identity_key_address = 1;
  bytes proving_key_address = 2;
  bytes identity_key_signature_of_proving_key = 3;
  bytes proving_key_signature_of_identity_key = 4;
}

message PutCrossSignatureResponse {
  string error = 1;
}

message PutSignedKeyRequest {
  bytes address = 1;
  quilibrium.node.keys.pb.SignedX448Key key = 2;
}

message PutSignedKeyResponse {
  string error = 1;
}

message GetIdentityKeyRequest {
  bytes address = 1;
}

message GetIdentityKeyResponse {
  quilibrium.node.keys.pb.Ed448PublicKey key = 1;
  string error = 2;
}

message GetProvingKeyRequest {
  bytes address = 1;
}

message GetProvingKeyResponse {
  quilibrium.node.keys.pb.BLS48581SignatureWithProofOfPossession key = 1;
  string error = 2;
}

message GetSignedKeyRequest {
  bytes address = 1;
}

message GetSignedKeyResponse {
  quilibrium.node.keys.pb.SignedX448Key key = 1;
  string error = 2;
}

message GetSignedKeysByParentRequest {
  bytes parent_key_address = 1;
  string key_purpose = 2;
}

message GetSignedKeysByParentResponse {
  repeated quilibrium.node.keys.pb.SignedX448Key keys = 1;
  string error = 2;
}

message RangeProvingKeysRequest {
}

message RangeProvingKeysResponse {
  quilibrium.node.keys.pb.BLS48581SignatureWithProofOfPossession key = 1;
  string error = 2;
}

message RangeIdentityKeysRequest {
}

message RangeIdentityKeysResponse {
  quilibrium.node.keys.pb.Ed448PublicKey key = 1;
  string error = 2;
}

message RangeSignedKeysRequest {
  bytes parent_key_address = 1;
	string key_purpose = 2;
}

message RangeSignedKeysResponse {
  quilibrium.node.keys.pb.SignedX448Key key = 1;
  string error = 2;
}

message MessageKeyShard {
  uint32 party_identifier = 1;
  bytes encrypted_key = 2;
}

message PutMessageRequest {
  // The fragmented key used to encrypt the message, encrypted to the distinct
  // mixnet peers
  repeated MessageKeyShard message_shards = 1;
  // The encrypted message to send
  bytes message = 2;
  // The ephemeral public key used to encrypt the original tag shard, used to
  // encrypt the message key shards and confirm authenticity
  bytes ephemeral_public_key = 3;
}

message PutMessageResponse {}

service MixnetService {
  // PutMessage puts a message into the round for use with message settlement.
  rpc PutMessage(PutMessageRequest)
    returns (PutMessageResponse);

  // RoundStream is the p2p stream channel for the mixnet peers.
  rpc RoundStream(stream quilibrium.node.application.pb.Message)
    returns (stream quilibrium.node.application.pb.Message);
}

service KeyRegistryService {
  // GetKeyRegistry retrieves the complete key registry for an identity key
	// address
	rpc GetKeyRegistry(GetKeyRegistryRequest)
    returns (GetKeyRegistryResponse);

	// GetKeyRegistryByProver retrieves the complete key registry for a prover key
	// address
	rpc GetKeyRegistryByProver(GetKeyRegistryByProverRequest)
    returns (GetKeyRegistryByProverResponse);

	// PutIdentityKey stores an identity key
	rpc PutIdentityKey(PutIdentityKeyRequest)
    returns (PutIdentityKeyResponse);

	// PutProvingKey stores a proving key with proof of possession
	rpc PutProvingKey(PutProvingKeyRequest)
    returns (PutProvingKeyResponse);

	// PutCrossSignature stores cross signatures between identity and proving keys
	rpc PutCrossSignature(PutCrossSignatureRequest)
    returns (PutCrossSignatureResponse);

	// PutSignedKey stores a signed X448 key
	rpc PutSignedKey(PutSignedKeyRequest)
    returns (PutSignedKeyResponse);

	// GetIdentityKey retrieves an identity key by address
	rpc GetIdentityKey(GetIdentityKeyRequest)
    returns (GetIdentityKeyResponse);

	// GetProvingKey retrieves a proving key by address
	rpc GetProvingKey(GetProvingKeyRequest)
    returns (GetProvingKeyResponse);

	// GetSignedKey retrieves a signed key by address
	rpc GetSignedKey(GetSignedKeyRequest)
    returns (GetSignedKeyResponse);

	// GetSignedKeysByParent retrieves all signed keys for a parent key
	rpc GetSignedKeysByParent(GetSignedKeysByParentRequest)
    returns (GetSignedKeysByParentResponse);

	// RangeProvingKeys returns an iterator over all proving keys
	rpc RangeProvingKeys(RangeProvingKeysRequest)
    returns (RangeProvingKeysResponse);

	// RangeIdentityKeys returns an iterator over all identity keys
	rpc RangeIdentityKeys(RangeIdentityKeysRequest)
    returns (RangeIdentityKeysResponse);

	// RangeSignedKeys returns an iterator over signed keys
	rpc RangeSignedKeys(RangeSignedKeysRequest)
    returns (RangeSignedKeysResponse);
}

service DispatchService {
  // Store a new message in an inbox
  rpc PutInboxMessage(quilibrium.node.channel.pb.InboxMessagePut) 
      returns (google.protobuf.Empty);
  
  // Retrieve messages based on criteria
  rpc GetInboxMessages(quilibrium.node.channel.pb.InboxMessageRequest) 
      returns (quilibrium.node.channel.pb.InboxMessageResponse);
  
  // Create or update a hub
  rpc PutHub(quilibrium.node.channel.pb.HubPut) 
      returns (google.protobuf.Empty);
  
  // Retrieve hub information
  rpc GetHub(quilibrium.node.channel.pb.HubRequest) 
      returns (quilibrium.node.channel.pb.HubResponse);
  
  // Synchronize dispatch data
  rpc Sync(quilibrium.node.channel.pb.DispatchSyncRequest) 
      returns (quilibrium.node.channel.pb.DispatchSyncResponse);
}
