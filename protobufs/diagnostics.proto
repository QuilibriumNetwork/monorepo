syntax = "proto3";

package quilibrium.node.diagnostics.pb;

option go_package = "source.quilibrium.com/quilibrium/monorepo/node/protobufs";

// Opt-in diagnostics a node serves on its authenticated peer listener to the
// peers its operator allowlists (`diagnostics.healthReport`,
// `diagnostics.logRequests`). The schema carries no strings: free text from
// the engine (blockers, errors, archive addresses) is mapped to the enums
// below or left out, so a message cannot carry paths, addresses or log text;
// logs travel only as a bundle sealed to the requester.

// A worker's lifecycle phase (`WorkerExecution.state`).
enum Phase {
  // The worker reported no observation.
  PHASE_UNSPECIFIED = 0;
  PHASE_STARTING = 1;
  // Waiting for an event that ends the wait (`blocker`, `awaited_frame`).
  PHASE_WAITING = 2;
  PHASE_SYNCING = 3;
  PHASE_SERVING = 4;
  PHASE_CLOSING = 5;
  PHASE_HANDOFF = 6;
  PHASE_BLOCKED = 7;
  PHASE_STOPPED = 8;
  // An older worker that reports only that its consensus host started.
  PHASE_RUNNING = 9;
  // The engine could not read its session state.
  PHASE_UNKNOWN = 10;
  // A phase this build does not know.
  PHASE_UNRECOGNIZED = 11;
  // The worker's allocation is joining or activating in this node's prover
  // registry, so its consensus waits for activation (`join_confirm_epoch`,
  // `activation_frame`). Readers that predate it see an unknown phase.
  PHASE_JOINING = 12;
}

// Why a worker's phase holds (`WorkerExecution.blocker`).
enum Blocker {
  BLOCKER_NONE = 0;
  // A reason this build does not know.
  BLOCKER_UNRECOGNIZED = 1;
  BLOCKER_WAITING_FOR_TRANSPORT = 2;
  BLOCKER_RESTARTING_CONSENSUS_HOST = 3;
  BLOCKER_ENGINE_EXITED = 4;
  BLOCKER_AWAITING_SUCCESSOR = 5;
  BLOCKER_STAGING_SHARD_DATA = 6;
  BLOCKER_AWAITING_CLOSING_CERTIFICATE = 7;
  BLOCKER_AWAITING_ALLOCATION_ACTIVATION = 8;
  BLOCKER_CHECKPOINT_MISMATCH = 9;
  BLOCKER_STATE_UNAVAILABLE = 10;
  BLOCKER_COMMITTEE_ADMISSION_UNAVAILABLE = 11;
  BLOCKER_CONSENSUS_STARTUP_UNAVAILABLE = 12;
  BLOCKER_SESSION_IDENTITY_UNAVAILABLE = 13;
  BLOCKER_SESSION_STATE_UNAVAILABLE = 14;
  // The worker's own store stopped writing until it is reopened: after a
  // failed write (a full disk, an I/O error), or below the node's
  // free-space floor.
  BLOCKER_STORAGE_WRITE_FAILED = 15;
  // Waits: GLOBAL has not authorized a committee session for the shard.
  BLOCKER_AWAITING_COMMITTEE_SESSION = 16;
  // Waits: the shard sync re-anchors the shard from an archive.
  BLOCKER_AWAITING_SHARD_REANCHOR = 17;
  // Waits: this node installs a GLOBAL state sync from an archive.
  BLOCKER_AWAITING_GLOBAL_STATE_SYNC = 18;
}

// The phase of a worker's archive recovery (`ShardRecovery.phase`).
enum RecoveryPhase {
  // No recovery attempt since the engine started.
  RECOVERY_PHASE_NONE = 0;
  RECOVERY_PHASE_IDLE = 1;
  RECOVERY_PHASE_WAITING_FOR_PERMIT = 2;
  RECOVERY_PHASE_REPLAYING_FRAMES = 3;
  RECOVERY_PHASE_FETCHING_CHECKPOINT = 4;
  RECOVERY_PHASE_INSTALLING_LEAVES = 5;
  RECOVERY_PHASE_INSTALLING_CHECKPOINT = 6;
  // An attempt started and has not named its phase yet.
  RECOVERY_PHASE_STARTING = 7;
  RECOVERY_PHASE_UNRECOGNIZED = 8;
}

// The class of a failed archive recovery attempt, by whose problem it is.
enum RecoveryFailure {
  RECOVERY_FAILURE_NONE = 0;
  // This node's master knows no reachable archive.
  RECOVERY_FAILURE_NO_ARCHIVE_KNOWN = 1;
  RECOVERY_FAILURE_CONNECT = 2;
  // The archive failed a read.
  RECOVERY_FAILURE_ARCHIVE_REQUEST = 3;
  // No archive supplied the shard state the worker needs.
  RECOVERY_FAILURE_ARCHIVE_STATE = 4;
  // The archive's frames do not apply to the worker's lineage (pre-state,
  // link, session or shard).
  RECOVERY_FAILURE_REPLAY_MISMATCH = 5;
  RECOVERY_FAILURE_OTHER = 6;
  // This node's own GLOBAL state sync was installing and withheld committed
  // GLOBAL state: an expected wait, no archive's failure.
  RECOVERY_FAILURE_GLOBAL_SYNC = 7;
  // A replayed frame waits for this node's proof verification: an expected
  // wait, no archive's failure.
  RECOVERY_FAILURE_PROOF_VERIFICATION = 8;
  // This worker's shard engine did not answer the recovery in time.
  RECOVERY_FAILURE_ENGINE_BUSY = 9;
}

message FailureCount {
  RecoveryFailure class = 1;
  uint32 count = 2;
}

// One data worker, as its master observes it. Times are the reporting
// node's clock; compare them with `HealthReport.generated_unix_ms`.
message WorkerHealth {
  uint32 core_id = 1;
  // The public shard filter the worker is bound to; empty when unallocated.
  bytes filter = 2;
  bool allocated = 3;
  Phase phase = 4;
  Blocker blocker = 5;
  // When the worker last refreshed its observation; 0 without one.
  uint64 observed_unix_ms = 6;
  // The worker's highest materialized app frame.
  optional uint64 materialized_frame = 7;
  // When that frame last advanced; 0 when it has not since the engine
  // started.
  uint64 last_advance_unix_ms = 8;
  // The shard's committee session and its head in committed GLOBAL state,
  // in this node's view.
  optional uint64 committee_head_frame = 9;
  optional uint64 committed_generation = 10;
  RecoveryPhase recovery_phase = 11;
  uint64 recovery_phase_since_unix_ms = 12;
  // Recovery attempts finished since the engine started, and how many of
  // the latest failed in a row.
  uint32 recovery_attempts = 13;
  uint32 recovery_consecutive_failures = 14;
  // Failed attempts since the engine started, by class.
  repeated FailureCount recovery_failures = 15;
  RecoveryFailure last_failure = 16;
  uint64 last_failure_unix_ms = 17;
  uint64 last_success_unix_ms = 18;
  // The longest wait for a recovery turn since the engine started.
  uint64 longest_permit_wait_ms = 19;
  // The session's finalized terminal seal, while the worker hands off.
  optional uint64 seal_generation = 20;
  // When this node saw GLOBAL record the seal; 0 until then.
  uint64 seal_recorded_unix_ms = 21;
  // While the worker's allocation joins: the epoch its join must be
  // confirmed in, until it is confirmed.
  optional uint64 join_confirm_epoch = 22;
  // While it joins or activates: the GLOBAL frame it joins its committee
  // at, if confirmed in time.
  optional uint64 activation_frame = 23;
  // While it waits on committed GLOBAL state (`PHASE_WAITING`): the GLOBAL
  // frame by which the awaited event happens.
  optional uint64 awaited_frame = 24;
  // Above the node's configured worker count: the worker takes no new seat
  // or join and stops once it holds none. Readers that predate it ignore it.
  bool draining = 25;
}

message HealthReport {
  uint32 schema = 1;
  // The release, `version.patch.subpatch`: 3 version bytes.
  bytes version = 2;
  uint32 patch = 3;
  // 0 when the build has no subpatch counter.
  uint32 subpatch = 4;
  // The SHA-256 build fingerprint this node also signs into its PeerInfo.
  bytes build_fingerprint = 5;
  // The newest GLOBAL frame this node advanced to the head of its time reel.
  uint64 global_head_frame = 6;
  uint64 generated_unix_ms = 7;
  // Allocated workers first, at most 256 and 32 KiB in all.
  repeated WorkerHealth workers = 8;
  // Workers left out by those bounds.
  uint32 omitted_workers = 9;
  // The master's store refuses writes after a failed write (a full disk,
  // an I/O error) until it is reopened.
  bool master_store_write_failed = 10;
  // The configured worker count; 0 from nodes that predate it.
  uint32 worker_capacity = 11;
  // How fast the master store's reads and the disk under it are; absent
  // from nodes that predate it or before the first interval closes.
  StoreIoHealth store_io = 12;
  // The health conditions this node detects and what it observed to judge
  // them; absent from nodes that predate it (they judge none).
  HealthConditions health = 13;
}

// A health condition this node detects (`HealthCondition.kind`). Readers
// that predate a kind show it by severity and scope only.
enum ConditionKind {
  CONDITION_KIND_UNSPECIFIED = 0;
  // Earning allocations whose worker's materialized app frame has not
  // advanced for its window.
  CONDITION_KIND_LOCAL_APP_FRAMES_UNCHANGED = 1;
  // Shards whose head, as peers report it, has not changed for its window.
  CONDITION_KIND_PEER_APP_FRAMES_UNCHANGED = 2;
  // Shards whose head in committed GLOBAL state has not changed for its
  // window while GLOBAL and the shard's app frames both advanced.
  CONDITION_KIND_GLOBAL_APP_FRAMES_UNCHANGED = 3;
  // Shards whose head in committed GLOBAL state trails their app head by
  // more than `HealthCondition.threshold` frames.
  CONDITION_KIND_GLOBAL_APP_FRAMES_BEHIND = 4;
  // This node's seats that signed under half the shard certificates a member
  // voting in time signs over the last hour, of those reporting a share.
  CONDITION_KIND_CERTIFICATE_SHARE_LOW = 5;
  // Shards holding data with at most `HealthCondition.threshold` provers
  // serving after the next epoch boundary.
  CONDITION_KIND_SHARD_HALT_RISK = 6;
  // Shards whose peer-reported materialized frame trails their head.
  CONDITION_KIND_PEER_MATERIALIZATION_LAG = 7;
  // This node's earning forecast over the last 60 minutes is below half its
  // 24 hour value. Served to this node only.
  CONDITION_KIND_REWARD_DROP = 8;
  // The master store's reads or the disk under it stay slow
  // (`StoreIoHealth.verdict`), or the store's disk took at least
  // `HealthCondition.threshold` ms to write and fsync 4 KiB
  // (`HealthCondition.store_fsync_ms`).
  CONDITION_KIND_STORE_IO_SLOW = 9;
  // The master store stopped writing (`master_store_write_failed`).
  CONDITION_KIND_MASTER_STORE_WRITE_FAILED = 10;
  // Peers cannot dial this node, by its own view of AutoNAT and its
  // addresses. Served to this node only.
  CONDITION_KIND_PEERS_CANNOT_DIAL = 11;
  // This node binds an IPv6 address peers could dial and publishes none.
  // Served to this node only.
  CONDITION_KIND_IPV6_NOT_PUBLISHED = 12;
  // This node's GLOBAL head (the frame it follows) has not advanced for
  // `HealthCondition.threshold` seconds. On a GLOBAL prover
  // `HealthCondition.global` counts the GLOBAL provers it hears.
  CONDITION_KIND_GLOBAL_HEAD_UNCHANGED = 13;
  // GLOBAL advanced fewer than `HealthCondition.threshold` frames an hour
  // over the window in `HealthCondition.global`.
  CONDITION_KIND_GLOBAL_FRAMES_SLOW = 14;
  // Active, leaving or epoch-stale allocations of this prover with no
  // worker bound to their shard for the base window.
  CONDITION_KIND_ALLOCATIONS_WITHOUT_WORKER = 15;
  // Earning allocations whose worker's execution is blocked or stopped for
  // the base window (the handoff wait excluded).
  CONDITION_KIND_LOCAL_EXECUTION_STOPPED = 16;
  // Active allocations whose recorded epoch is older than the current one:
  // their re-confirm for this epoch has not been recorded.
  CONDITION_KIND_ALLOCATION_EPOCH_STALE = 17;
  // Allocations whose renewal this node withholds: their worker sent no
  // vote for an epoch while the other members voted.
  CONDITION_KIND_RENEWAL_WITHHELD = 18;
  // Workers whose latest archive recovery attempt failed and that still
  // trail the head peers report for their shard.
  CONDITION_KIND_RECOVERY_FAILING = 19;
  // Allocations rejected or kicked in this epoch or the previous one,
  // joins that missed their confirm window included.
  CONDITION_KIND_ALLOCATIONS_REJECTED = 20;
  // Paused allocations: they serve no committee and earn nothing.
  CONDITION_KIND_ALLOCATIONS_PAUSED = 21;
  // Workers bound to a shard where this prover holds no live allocation.
  CONDITION_KIND_WORKERS_BOUND_WITHOUT_ALLOCATION = 22;
  // Running or serving workers that have materialized no app frame for
  // the base window.
  CONDITION_KIND_LOCAL_APP_FRAMES_NONE_MATERIALIZED = 23;
  // Workers whose latest observation is older than `threshold` seconds, so
  // their execution state is unknown.
  CONDITION_KIND_WORKER_OBSERVATIONS_STALE = 24;
  // An expected wait: an archive state sync of GLOBAL has installed some of
  // its chunks but not the last, so committed GLOBAL state (each shard's
  // committed head among it) is unreadable until it does. A warning once it
  // lasts past `HealthCondition.wait.expected_secs`.
  CONDITION_KIND_GLOBAL_STATE_SYNC_INSTALLING = 25;
  // An expected wait: the epoch ends within the frames a prover op takes to
  // land, and every node refuses an op landing in a later epoch than it was
  // signed in, so pauses, resumes, leaves and updates are signed from
  // `HealthCondition.wait.until_frame`, the next epoch's first frame.
  CONDITION_KIND_PROVER_OPS_WAIT_FOR_EPOCH = 26;
  // An expected wait: admission refuses shields of legacy coins before
  // `HealthCondition.wait.until_frame` (`token shield`) and
  // `HealthCondition.wait.batch_from_frame` (`token shield-all`).
  CONDITION_KIND_SHIELDS_NOT_ADMITTED = 27;
}

enum ConditionSeverity {
  CONDITION_SEVERITY_UNSPECIFIED = 0;
  CONDITION_SEVERITY_INFO = 1;
  CONDITION_SEVERITY_WARNING = 2;
  CONDITION_SEVERITY_ERROR = 3;
}

// Whose problem a condition is, as far as this node can tell.
enum ConditionScope {
  CONDITION_SCOPE_UNSPECIFIED = 0;
  CONDITION_SCOPE_THIS_NODE = 1;
  // What peers report: the peer or the shard it reports on.
  CONDITION_SCOPE_PEER = 2;
  // Committed GLOBAL state, the same on every node that follows it.
  CONDITION_SCOPE_NETWORK = 3;
}

// What the operator checks next (`HealthCondition.action`); readers map it
// to text, and one that predates a value points to this node's log.
enum ConditionAction {
  CONDITION_ACTION_UNSPECIFIED = 0;
  // The affected workers' logs: sync, close, handoff and activation waits
  // are excluded, so a stop there is an engine or consensus failure.
  CONDITION_ACTION_CHECK_WORKER_LOGS = 1;
  // The shard on the explorer: advancing there means the reporting peer
  // trails; stopped there means the shard halted.
  CONDITION_ACTION_COMPARE_PEER_WITH_EXPLORER = 2;
  // GLOBAL's inclusion of the shard on the explorer: advancing there means
  // this node's GLOBAL view trails.
  CONDITION_ACTION_CHECK_GLOBAL_INCLUSION = 3;
  // The seat's worker: blocked or behind its shard, silent, or voting late.
  CONDITION_ACTION_CHECK_SEAT_WORKER = 4;
  // The shard's prover count: a join adds coverage, a leave there risks it.
  CONDITION_ACTION_CHECK_SHARD_PROVERS = 5;
  // The allocations' certificate share and their shards' frame intervals.
  CONDITION_ACTION_CHECK_SEATS_AND_FRAMES = 6;
  // TRIM, the disk's health and other I/O load, then this node's load.
  CONDITION_ACTION_CHECK_DISK_AND_LOAD = 7;
  // Free space or the failed write, then a node restart to reopen the store.
  CONDITION_ACTION_REOPEN_MASTER_STORE = 8;
  // `qclient node doctor`: the verdict per address family and what to change.
  CONDITION_ACTION_RUN_NODE_DOCTOR = 9;
  // GLOBAL's head on the explorer: stopped there means GLOBAL halted
  // network-wide; advancing there means this node stopped following it.
  CONDITION_ACTION_CHECK_GLOBAL_HEAD = 10;
  // GLOBAL's frame rate on the explorer: slow there means its provers vote
  // late or skip leader turns; normal there means this node receives its
  // frames late.
  CONDITION_ACTION_CHECK_GLOBAL_RATE = 11;
  // The worker allocator's log lines and the free workers: an allocation
  // without a worker does no work.
  CONDITION_ACTION_BIND_WORKERS = 12;
  // Each affected row's blocker and its worker's log.
  CONDITION_ACTION_CHECK_BLOCKERS = 13;
  // The node's prover confirmation log lines.
  CONDITION_ACTION_CHECK_PROVER_CONFIRMATIONS = 14;
  // The silent workers: restart one that stays silent.
  CONDITION_ACTION_CHECK_SILENT_WORKERS = 15;
  // The recovery's error and failure streak, and the archives it reads.
  CONDITION_ACTION_CHECK_ARCHIVE_RECOVERY = 16;
  // The allocations on the explorer and the node's join and confirmation
  // log lines.
  CONDITION_ACTION_CHECK_ALLOCATIONS = 17;
  // Resume the paused allocations or leave them.
  CONDITION_ACTION_RESUME_OR_LEAVE = 18;
  // The workers' bindings, once their closing sessions sealed.
  CONDITION_ACTION_CHECK_WORKER_BINDINGS = 19;
  // The worker processes: their reports stopped arriving.
  CONDITION_ACTION_CHECK_WORKER_PROCESSES = 20;
  // None while the GLOBAL state sync installs; past its expected time, the
  // node's `sync phase` and prover tree sync log lines.
  CONDITION_ACTION_WAIT_FOR_GLOBAL_SYNC = 21;
  // None: ops wait for the next epoch; past the expected time, whether this
  // node follows GLOBAL.
  CONDITION_ACTION_WAIT_FOR_NEXT_EPOCH = 22;
  // None: shield once GLOBAL reaches the admission frame.
  CONDITION_ACTION_WAIT_FOR_SHIELD_ADMISSION = 23;
  // The store's drive: its fsync latency and what else writes to it.
  CONDITION_ACTION_CHECK_STORE_FSYNC = 24;
}

// One shard or allocation a condition affects.
message AffectedShard {
  // The public shard filter.
  bytes filter = 1;
  // The worker serving it, for conditions of this node's workers; 0
  // otherwise.
  uint32 core_id = 2;
  // The frame that has not moved (for `..._BEHIND`, the committed head; for
  // `..._MATERIALIZATION_LAG`, the materialized frame).
  uint64 frame = 3;
  // Since when this node has seen that frame unchanged; 0 for `..._BEHIND`.
  uint64 unchanged_since_unix_ms = 4;
  // The window this shard was judged by: the base window, or 3 of its
  // mean frame intervals on a slower shard; 0 for `..._BEHIND`.
  uint64 window_secs = 5;
  // For `..._BEHIND`: the frames the committed head trails the app head; for
  // `..._MATERIALIZATION_LAG`: the frames materialization trails its head.
  uint64 lag_frames = 6;
}

// A condition current in this node's view. Each one is logged when it
// starts, at most every 10 minutes while it lasts, and when it ends.
message HealthCondition {
  ConditionKind kind = 1;
  ConditionSeverity severity = 2;
  ConditionScope scope = 3;
  ConditionAction action = 4;
  // When it started, on this node's clock.
  uint64 since_unix_ms = 5;
  // Affected of tracked: the count and its denominator.
  uint32 affected = 6;
  uint32 tracked = 7;
  // The base window in seconds for the `..._UNCHANGED` kinds, the lag in
  // frames for `..._BEHIND`, the frames an hour for `..._FRAMES_SLOW`, the
  // prover count for `..._HALT_RISK`; 0 for kinds without one.
  uint64 threshold = 8;
  // The affected shards, at most 64; the rest are counted.
  repeated AffectedShard shards = 9;
  uint32 omitted_shards = 10;
  // For `..._STORE_IO_SLOW`: the interval that was judged.
  StoreIoHealth store_io = 11;
  // For `..._REWARD_DROP`: the forecasts over the last 60 minutes and 24
  // hours, in base units per day.
  uint64 reward_hour_units = 12;
  uint64 reward_day_units = 13;
  // For the GLOBAL progress kinds: what was judged.
  GlobalProgress global = 14;
  // For the expected waits: what ends it.
  ExpectedWait wait = 15;
  // For `..._STORE_IO_SLOW`: the store's latest 4 KiB write and fsync, in
  // ms, when at or past its bound; unset otherwise. `threshold` holds the
  // bound, in ms, once the probe has run.
  optional uint64 store_fsync_ms = 16;
}

// An expected wait as this node judged it (`HealthCondition.wait`).
message ExpectedWait {
  // The GLOBAL head it was judged at (`last_global_head_frame`).
  uint64 head_frame = 1;
  // The GLOBAL frame that ends it; 0 when an event other than a frame does.
  uint64 until_frame = 2;
  // For `..._SHIELDS_NOT_ADMITTED`: the frame batch shields are admitted
  // from; 0 otherwise.
  uint64 batch_from_frame = 3;
  // How long it lasts at most when all is well; 0 when only its frame bounds
  // it. A wait lasting longer is a warning.
  uint64 expected_secs = 4;
}

// GLOBAL's progress as this node judged it (`HealthCondition.global`).
message GlobalProgress {
  // This node's GLOBAL head.
  uint64 head = 1;
  // Frames GLOBAL advanced over `span_secs`: for `..._HEAD_UNCHANGED` 0 over
  // the span the head stayed, for `..._FRAMES_SLOW` the rate's window.
  uint64 advanced_frames = 2;
  uint64 span_secs = 3;
  // On a GLOBAL prover: the GLOBAL provers, those heard from recently (this
  // node included) and the quorum consensus needs; 0 elsewhere.
  uint32 provers = 4;
  uint32 reachable = 5;
  uint32 quorum = 6;
}

// What this node observed to judge one kind, so a reader can tell "nothing
// wrong" from "nothing observed".
message ConditionSource {
  ConditionKind kind = 1;
  // The latest fresh observation the kind was judged on; 0 without one.
  uint64 observed_unix_ms = 2;
  // What it tracks with fresh observations (allocations or shards).
  uint32 tracked = 3;
}

message HealthConditions {
  // The conditions found at the last evaluation, worst first. One that is
  // clear is not served: it ends after 60 s clear, and one recurring sooner
  // is served again under its first start, without a log line, so it can
  // be missing between its start and end lines; those lines count such
  // clear spells (`clear_spells`, `unserved_secs`).
  repeated HealthCondition conditions = 1;
  // Every kind this build judges, observed or not.
  repeated ConditionSource sources = 2;
}

// Whether the master store's reads and its disk are fast enough
// (`StoreIoHealth.verdict`).
enum StoreIoVerdict {
  // Nothing measured: no canary read and no disk counters.
  STORE_IO_VERDICT_UNSPECIFIED = 0;
  STORE_IO_VERDICT_OK = 1;
  // Over a slow threshold for 2 intervals in a row, until 3 intervals in a
  // row are under every threshold: reads of the store are too slow.
  // `slow_reason` and the disk fields say whether the disk (an await over
  // its threshold), this node's load (the disk responds normally) or
  // neither can be told (no disk figures) is the cause.
  STORE_IO_VERDICT_SLOW = 2;
}

// The slow threshold an interval crossed (`StoreIoHealth.slow_reason`).
enum StoreIoReason {
  STORE_IO_REASON_NONE = 0;
  // 2 or more canary reads at or over 50 ms in the interval (p99 is then
  // over it too), or one of 1 s or more. Before this rule, p99 alone.
  STORE_IO_REASON_CANARY_P99 = 1;
  // A canary read unfinished for 1 s or more at the interval's end.
  STORE_IO_REASON_CANARY_PENDING = 2;
  // Disk await at or over 20 ms a read or 100 ms a write, of 20 or more.
  STORE_IO_REASON_DISK_READ_AWAIT = 3;
  STORE_IO_REASON_DISK_WRITE_AWAIT = 4;
}

// The master store's latest summary interval (60 s): a canary that reads
// one entry of the store a second at a random position, bypassing its
// block cache, and on Linux the device under the store in /proc/diskstats.
message StoreIoHealth {
  StoreIoVerdict verdict = 1;
  // How long the verdict has been SLOW; 0 while it is not.
  uint64 slow_secs = 2;
  uint32 interval_secs = 3;
  uint64 ended_unix_ms = 4;
  // Canary reads finished in the interval and their latency.
  uint32 canary_reads = 5;
  uint64 canary_p50_us = 6;
  uint64 canary_p99_us = 7;
  uint64 canary_max_us = 8;
  // How long a canary read unfinished at the interval's end had run; 0
  // without one.
  uint64 canary_pending_us = 9;
  // The device's completed reads and writes and the mean time each took,
  // queueing included, and the share of the interval it was busy; unset
  // off Linux or when the device is unresolved (an await also without
  // operations).
  optional uint64 disk_reads = 10;
  optional uint64 disk_writes = 11;
  optional uint64 disk_read_await_us = 12;
  optional uint64 disk_write_await_us = 13;
  optional uint32 disk_busy_pct = 14;
  StoreIoReason slow_reason = 15;
}

message GetHealthReportRequest {}

service DiagnosticsService {
  // Served only to this node itself and to allowlisted peers; others get
  // PERMISSION_DENIED, and an allowlisted peer asking again within the
  // configured interval RESOURCE_EXHAUSTED.
  rpc GetHealthReport(GetHealthReportRequest) returns (HealthReport);
}

// A peer's request for this node's redacted logs (`diagnostics.logRequests`),
// signed by the requester's network key. The target seals a redacted export
// of the window to `recipient_kem_public_key`: its node does so itself, as
// its operator's allowlist consents, or, when it writes no log files, its
// operator after reviewing a redacted preview.
message LogRequest {
  // 1.
  uint32 schema = 1;
  // The peer ID of the node asked for its logs.
  bytes target_peer_id = 2;
  // The requester's Falcon-512 network public key; its peer ID must be the
  // one the requester's handshake proved.
  bytes requester_public_key = 3;
  uint64 issued_unix_ms = 4;
  // Random, 16 bytes; a target refuses a nonce it has seen.
  bytes nonce = 5;
  // The window, in UTC Unix seconds: at most 24 h.
  uint64 since_unix = 6;
  uint64 until_unix = 7;
  // Full public shard filters whose lines to export (at most 16, each 32 to
  // 64 bytes); none exports every line of the window.
  repeated bytes filters = 8;
  // A fresh sntrup761 public key of this request alone; only the requester
  // holds its secret key.
  bytes recipient_kem_public_key = 9;
}

// `request` is an encoded LogRequest, signed as it is with the domain
// "quil/diagnostics/log-request/v1".
message SignedLogRequest {
  bytes request = 1;
  bytes signature = 2;
}

enum LogRequestStatus {
  LOG_REQUEST_STATUS_UNSPECIFIED = 0;
  // Being exported by the target's node, or waiting for its operator.
  LOG_REQUEST_STATUS_PENDING = 1;
  // Approved: the sealed bundle waits for its fetch.
  LOG_REQUEST_STATUS_READY = 2;
  LOG_REQUEST_STATUS_DENIED = 3;
  // Neither approved nor fetched in time.
  LOG_REQUEST_STATUS_EXPIRED = 4;
  // Fetched completely at least once; fetchable until it expires.
  LOG_REQUEST_STATUS_SERVED = 5;
  // Not queued: see the refusal.
  LOG_REQUEST_STATUS_REFUSED = 6;
}

// Why an allowlisted peer's signed request was not queued.
enum LogRequestRefusal {
  LOG_REQUEST_REFUSAL_NONE = 0;
  LOG_REQUEST_REFUSAL_MALFORMED = 1;
  // The request names another node.
  LOG_REQUEST_REFUSAL_WRONG_TARGET = 2;
  // Issued, or ending, more than 10 minutes from the target's clock.
  LOG_REQUEST_REFUSAL_STALE = 3;
  LOG_REQUEST_REFUSAL_REPLAYED = 4;
  LOG_REQUEST_REFUSAL_WINDOW_TOO_LONG = 5;
  LOG_REQUEST_REFUSAL_TOO_MANY_FILTERS = 6;
  // The peer's `requestsPerDay` are used up.
  LOG_REQUEST_REFUSAL_OVER_BUDGET = 7;
  // `maxPending` requests wait already.
  LOG_REQUEST_REFUSAL_QUEUE_FULL = 8;
  // A filter is not a full shard filter (32 to 64 bytes).
  LOG_REQUEST_REFUSAL_FILTER_LENGTH = 9;
  // This requester's requests awaiting a decision or a fetch hold half of
  // `maxPending` already.
  LOG_REQUEST_REFUSAL_TOO_MANY_PENDING = 10;
}

message SubmitLogRequestResponse {
  // The first 16 bytes of SHA3-256 of the request bytes.
  bytes request_id = 1;
  LogRequestStatus status = 2;
  LogRequestRefusal refusal = 3;
  uint64 expires_unix_ms = 4;
  // The target's node approves the request itself rather than waiting for
  // its operator.
  bool automatic = 5;
  // The requester's budget of `requestsPerDay` in the last 24 h, after
  // this submission: the requests it may still make, and the budget. A
  // node of an earlier release sets neither.
  optional uint32 requests_remaining = 6;
  optional uint32 requests_per_day = 7;
  // When the oldest request counted in the last 24 h ages out, freeing one
  // request; unset while none is counted.
  optional uint64 next_request_unix_ms = 8;
}

message GetLogRequestStatusRequest {
  bytes request_id = 1;
}

// Who denied a request, and why.
enum LogRequestDenial {
  // The target's operator, or a node that reports no reason.
  LOG_REQUEST_DENIAL_OPERATOR = 0;
  // The target's node: the export exceeds its `maxBundleBytes`.
  LOG_REQUEST_DENIAL_TOO_LARGE = 1;
  // The target's node: its export failed; its log names the reason.
  LOG_REQUEST_DENIAL_EXPORT_FAILED = 2;
}

message LogRequestStatusResponse {
  bytes request_id = 1;
  LogRequestStatus status = 2;
  // The sealed bundle's size, once approved.
  uint64 bundle_bytes = 3;
  uint64 expires_unix_ms = 4;
  // Once denied.
  LogRequestDenial denial = 5;
}

message FetchLogBundleRequest {
  bytes request_id = 1;
  // Resume at this byte of the sealed bundle.
  uint64 offset = 2;
}

message LogBundleChunk {
  uint64 total_bytes = 1;
  uint64 offset = 2;
  bytes data = 3;
  // SHA-256 of the whole sealed bundle.
  bytes sha256 = 4;
}

message ListLogRequestsRequest {}

// A request as the target's operator reviews it.
message PendingLogRequest {
  bytes request_id = 1;
  bytes requester_peer_id = 2;
  LogRequestStatus status = 3;
  uint64 received_unix_ms = 4;
  uint64 expires_unix_ms = 5;
  uint64 since_unix = 6;
  uint64 until_unix = 7;
  repeated bytes filters = 8;
  bytes recipient_kem_public_key = 9;
  uint64 bundle_bytes = 10;
}

message ListLogRequestsResponse {
  repeated PendingLogRequest requests = 1;
  // `maxBundleBytes`: the largest sealed bundle this node accepts.
  uint64 max_bundle_bytes = 2;
  // This node approves pending requests itself.
  bool automatic = 3;
}

message DenyLogRequestRequest {
  bytes request_id = 1;
}

message DenyLogRequestResponse {
  LogRequestStatus status = 1;
}

// One piece of a sealed bundle; the first names the request, the total size
// and the SHA-256 of the whole bundle.
message UploadLogBundleChunk {
  bytes request_id = 1;
  uint64 total_bytes = 2;
  bytes sha256 = 3;
  bytes data = 4;
}

message UploadLogBundleResponse {
  LogRequestStatus status = 1;
  uint64 expires_unix_ms = 2;
}

// For allowlisted peers (`diagnostics.logRequests`): every method answers
// PERMISSION_DENIED to others, and NOT_FOUND for another peer's request.
service DiagnosticsLogService {
  rpc SubmitLogRequest(SignedLogRequest) returns (SubmitLogRequestResponse);
  rpc GetLogRequestStatus(GetLogRequestStatusRequest) returns (LogRequestStatusResponse);
  rpc FetchLogBundle(FetchLogBundleRequest) returns (stream LogBundleChunk);
}

// For this node's own identity only, which its operator's qclient holds:
// whoever holds this node's network key acts as its operator here.
service DiagnosticsOperatorService {
  rpc ListLogRequests(ListLogRequestsRequest) returns (ListLogRequestsResponse);
  // Deny a pending request, or withdraw an approved bundle, deleting it.
  rpc DenyLogRequest(DenyLogRequestRequest) returns (DenyLogRequestResponse);
  // Approve a pending request with its bundle, sealed by the operator's
  // qclient to the request's key, on a node that does not approve requests
  // itself.
  rpc UploadLogBundle(stream UploadLogBundleChunk) returns (UploadLogBundleResponse);
}
