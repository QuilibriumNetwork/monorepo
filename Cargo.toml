# Lint levels for first-party crates (`[lints] workspace = true`);
# vendored crates keep their own `[lints]` tables. Every lint clippy
# enables by default is denied, except those listed: they still fire in
# our code and warn until fixed. A change that fixes one deletes its line.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
assertions_on_constants = "warn"
await_holding_lock = "warn"
bool_assert_comparison = "warn"
clone_on_copy = "warn"
cloned_ref_to_slice_refs = "warn"
collapsible_if = "warn"
collapsible_match = "warn"
comparison_to_empty = "warn"
default_constructed_unit_structs = "warn"
derivable_impls = "warn"
doc_lazy_continuation = "warn"
double_ended_iterator_last = "warn"
duplicated_attributes = "warn"
empty_line_after_doc_comments = "warn"
enum_variant_names = "warn"
err_expect = "warn"
excessive_precision = "warn"
explicit_auto_deref = "warn"
extend_with_drain = "warn"
field_reassign_with_default = "warn"
for_kv_map = "warn"
get_first = "warn"
if_same_then_else = "warn"
implicit_saturating_sub = "warn"
int_plus_one = "warn"
io_other_error = "warn"
items_after_test_module = "warn"
iter_cloned_collect = "warn"
large_enum_variant = "warn"
len_without_is_empty = "warn"
len_zero = "warn"
manual_checked_ops = "warn"
manual_contains = "warn"
manual_div_ceil = "warn"
manual_flatten = "warn"
manual_inspect = "warn"
manual_is_multiple_of = "warn"
manual_memcpy = "warn"
manual_range_contains = "warn"
manual_range_patterns = "warn"
manual_repeat_n = "warn"
manual_strip = "warn"
manual_unwrap_or_default = "warn"
map_clone = "warn"
map_entry = "warn"
map_flatten = "warn"
map_identity = "warn"
match_like_matches_macro = "warn"
missing_transmute_annotations = "warn"
module_inception = "warn"
needless_borrow = "warn"
needless_borrows_for_generic_args = "warn"
needless_lifetimes = "warn"
needless_question_mark = "warn"
needless_range_loop = "warn"
needless_return = "warn"
needless_update = "warn"
new_without_default = "warn"
nonminimal_bool = "warn"
obfuscated_if_else = "warn"
only_used_in_recursion = "warn"
op_ref = "warn"
precedence = "warn"
print_literal = "warn"
ptr_arg = "warn"
redundant_closure = "warn"
redundant_field_names = "warn"
redundant_locals = "warn"
result_large_err = "warn"
should_implement_trait = "warn"
single_component_path_imports = "warn"
single_element_loop = "warn"
single_match = "warn"
to_string_in_format_args = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
unnecessary_cast = "warn"
unnecessary_fold = "warn"
unnecessary_get_then_check = "warn"
unnecessary_lazy_evaluations = "warn"
unnecessary_map_or = "warn"
unnecessary_sort_by = "warn"
unnecessary_to_owned = "warn"
unnecessary_unwrap = "warn"
unused_enumerate_index = "warn"
unwrap_or_default = "warn"
useless_asref = "warn"
useless_conversion = "warn"
useless_format = "warn"
useless_vec = "warn"
vec_init_then_push = "warn"
while_let_loop = "warn"
wrong_self_convention = "warn"

[patch.crates-io]
# Keep the pinned consensus dependency available for targeted local fixes.
commonware-consensus = { path = "crates/commonware-consensus" }
# jmt: vendored 0.11.0 with a visibility-only patch (gen_child_node_key +
# NibblePath::new made pub) so the forest's efficient Merkle-diff sync
# (quil-forest/src/sync.rs) can walk two trees top-down and transfer only
# differing subtrees. No behavior change; see crates/jmt patch comments.
jmt = { path = "crates/jmt" }
# Fork libp2p-identity to add Ed448 (KeyType=4) support for Quilibrium peer IDs
libp2p-identity = { path = "crates/libp2p-identity" }
# libp2p-autonat: re-vendored to 0.15.0 for the libp2p 0.56 bump, with two
# local changes: a panic guard for an inbound dial-back racing the sender's
# disconnect (upstream `.expect`s "Peer is connected." and kills the swarm
# task), and a short dial-back address list, listen ports first, from a
# bounded candidate set (upstream sends every address identify ever
# observed, which defeated the probes). See crates/libp2p-autonat/PATCHES.md.
libp2p-autonat = { path = "crates/libp2p-autonat" }
# libp2p-kad: fork DROPPED for the 0.56 bump — the only local delta was the
# MAX_NUM_STREAMS 32→256 bump, which we are intentionally not carrying
# forward; stock libp2p-kad 0.48 is used from crates.io.
# libp2p-tls: vendored 0.6.2 fork adding a post-quantum, pure-NTRU QUIC
# key-exchange group (sntrup761) — `make_client_config`/`make_server_config`
# set `provider.kx_groups = [SNTRUP761]`, so QUIC (libp2p-quic → quinn → rustls)
# negotiates NTRU instead of X25519. See `crates/libp2p-tls/src/sntrup761_kx.rs`.
libp2p-tls = { path = "crates/libp2p-tls" }
# libp2p-gossipsub: vendored 0.49.4 to cut per-message copies and cache only
# what this node can validate and forward. An inbound message is no longer
# cloned (metrics, transform, IDONTWANT sizing) before the duplicate check, so
# a mesh duplicate costs one decode; messages on topics we do not subscribe to
# are not cached (they were never validated, so they sat in the cache until
# the history window rolled over); signature verification encodes the signed
# bytes from borrowed fields instead of cloning the message twice. IDONTWANT
# works on our custom protocol id (`Version::V1_2`), is sent for a message's
# first copy only, and is sent with priority. The message cache has a byte
# budget (`mcache_max_bytes`): past it, the oldest messages are evicted,
# validated ones first. An inbound RPC is checked before it is decoded: one
# carrying more entries of a kind than an RPC may, or malformed, is dropped,
# its stream closed and its sender penalised. The wire format is unchanged.
# Local changes are marked `QUILIBRIUM:`; see
# crates/libp2p-gossipsub/PATCHES.md.
libp2p-gossipsub = { path = "crates/libp2p-gossipsub" }

[profile.release]
# rpath = false is important to make Go bindings work
rpath = false
lto   = true
debug = false
# panic = 'abort'

# The profile of the devnet smoke test (scripts/devnet-smoke.sh): release
# optimization without fat LTO, so the node links in a fraction of the time
# and its artifacts stay small enough to cache.
[profile.devnet]
inherits = "release"
lto = false

# Test profile overrides.
#
# Cryptography tests are 10-100x slower in unoptimized builds because the
# hand-rolled big-int, pairing, FFT, OT, and bulletproof code (and the
# heavy third-party curve/hash crates) need inlining and const
# propagation to be fast. The overrides below compile those packages
# with optimizations when building tests; Swatinem/rust-cache caches
# the resulting artifacts so the cost is paid once. Debug assertions
# and overflow checks remain on. `cargo build`/`cargo check` are
# unaffected — they use profile.dev.

# Test binaries keep file/line for every frame — backtraces, panic
# locations and test failure output are unchanged — but drop the DWARF
# needed to inspect variables under a debugger.  That debug info is the
# single largest thing the test profile writes: on a cold
# `cargo test -p quil-engine --no-run` it accounts for 4.4 GB of a
# 17.4 GB target directory, 3.4 GB of it in `debug/deps`.
[profile.test]
debug = "line-tables-only"

# All third-party dependencies. `*` matches every package except the
# one currently being built, so workspace members still need explicit
# overrides below.
[profile.test.package."*"]
opt-level = 3

# Workspace crates whose own code is the hot path in tests.
[profile.test.package.bls48581]
opt-level = 3
[profile.test.package.quil-storage-stark]
opt-level = 3
[profile.test.package.dkls23]
opt-level = 3
[profile.test.package.dkls23_ffi]
opt-level = 3
[profile.test.package.ed448-bulletproofs]
opt-level = 3
[profile.test.package.classgroup]
opt-level = 3
[profile.test.package.vdf]
opt-level = 3
[profile.test.package.ferret]
opt-level = 3
[profile.test.package.channel]
opt-level = 3
[profile.test.package.verenc]
opt-level = 3
[profile.test.package.rpm]
opt-level = 3
