    "crates/rpm",
    "crates/bulletproofs",
    "crates/verenc",
    "crates/ferret",
    "crates/dkls23_ffi",
    "crates/dkls23-wasm",
    "crates/dkls23",
    "crates/quil-types",
    "crates/quil-config",
    "crates/quil-lifecycle",
    "crates/quil-crypto",
    "crates/quil-storage-stark",
    "crates/quil-tries",
    "crates/quil-tries-ffi",
    "crates/quil-forest",
    "crates/quil-cw-consensus",
    "crates/quil-forest-migrate",
    "crates/quil-lattice-ct",
    "crates/quil-lattice-proof-sys",
    "crates/quil-store",
